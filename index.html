<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev & Mod AI Assistant - Puter</title>
    <!-- Libreria Puter.js per l'IA integrata senza chiavi -->
    <script src="https://js.puter.com/v2/puter.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --chat-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --border-color: #30363d;
            --user-bubble: #1f6feb;
            --ai-bubble: #21262d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            color: #ffffff;
        }
        .status-badge {
            font-size: 0.85rem;
            color: #7ee787;
            background: rgba(46, 160, 67, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(46, 160, 67, 0.4);
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .user-message {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: var(--ai-bubble);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .ai-message pre {
            background-color: #0d1117;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }
        .ai-message code {
            font-family: "Courier New", Courier, monospace;
            font-size: 0.85rem;
            color: #7ee787;
        }
        .input-area {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 6px;
            resize: none;
            height: 50px;
            max-height: 120px;
            outline: none;
            font-size: 0.95rem;
        }
        textarea:focus {
            border-color: var(--user-bubble);
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>🛠️ Dev & Mod AI Assistant</h1>
        <div class="status-badge">Pronto all'uso (Senza API Key)</div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            Ciao! Questo assistente non richiede chiavi API. Scrivi pure qui sotto la tua richiesta per ottenere codici, guide di programmazione e strutture per i tuoi progetti.
        </div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Scrivi qui la tua richiesta di codice..." rows="1"></textarea>
        <button id="sendBtn">Invia</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mostra il messaggio dell'utente
            appendMessage(text, 'user-message');
            userInput.value = '';
            userInput.style.height = '50px';

            // Messaggio di caricamento
            const loadingId = appendMessage("Elaborazione in corso...", 'ai-message');

            try {
                // Sfrutta l'intelligenza artificiale integrata tramite Puter.js
                const response = await puter.ai.chat(text);
                
                // Rimuovi il messaggio di caricamento
                document.getElementById(loadingId).remove();

                if (response) {
                    appendMessage(formatResponse(response), 'ai-message', true);
                } else {
                    appendMessage("Nessuna risposta ricevuta dal server.", 'ai-message');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Errore di connessione o limite temporaneo raggiunto. Riprova tra poco.", 'ai-message');
            }
        }

        function appendMessage(text, className, isHTML = false) {
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            messageDiv.className = `message ${className}`;
            
            if (isHTML) {
                messageDiv.innerHTML = text;
            } else {
                messageDiv.textContent = text;
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function formatResponse(text) {
            let formatted = text.replace(/```([\s\S]*?)```/g, (match, p1) => {
                return `<pre><code>${escapeHtml(p1.trim())}</code></pre>`;
            });
            return formatted.replace(/\n/g, '<br>');
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Animus Protocol - 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #02050b; font-family: sans-serif; color: #fff; touch-action: none;
        }
        #canvas-box { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; padding: 15px;
        }
        .header {
            display: flex; justify-content: space-between; background: rgba(3, 8, 18, 0.9);
            border: 1px solid rgba(0, 243, 255, 0.4); padding: 12px; border-radius: 8px; font-size: 13px; pointer-events: auto;
        }
        .reticle {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: #00f3ff; border-radius: 50%; z-index: 2;
        }
        .pad-area {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 170px; z-index: 3;
            display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; pointer-events: auto;
        }
        .joystick { width: 120px; height: 120px; position: relative; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.3); border-radius: 50%; }
        .j-btn { position: absolute; background: rgba(0,243,255,0.25); border: 1px solid #00f3ff; color: #00f3ff; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; }
        #jb-up { top: 5px; left: 40px; width: 40px; height: 35px; }
        #jb-down { bottom: 5px; left: 40px; width: 40px; height: 35px; }
        #jb-left { top: 40px; left: 5px; width: 35px; height: 40px; }
        #jb-right { top: 40px; right: 5px; width: 35px; height: 40px; }
        .action-btn {
            background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #00f3ff;
            padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="reticle"></div>
    <div id="canvas-box"></div>

    <div class="ui-layer">
        <div class="header">
            <div>STATUS: <span style="color:#ff3366">SIMULAZIONE ATTIVA</span></div>
            <div>RACCOLTI: <span id="counter" style="color:#00f3ff">0</span>/4</div>
        </div>
        <div style="background: rgba(10,25,47,0.95); border-left: 3px solid #00f3ff; padding: 10px; font-size: 12px; border-radius: 0 6px 6px 0; max-width: 280px;" id="text-info">
            Trascina lo schermo per orientare lo sguardo. Trova i moduli energetici nella foresta.
        </div>
        <div class="pad-area">
            <div class="joystick">
                <div class="j-btn" id="jb-up" ontouchstart="setMove('f')" ontouchend="setMove('')" onmousedown="setMove('f')" onmouseup="setMove('')">▲</div>
                <div class="j-btn" id="jb-down" ontouchstart="setMove('b')" ontouchend="setMove('')" onmousedown="setMove('b')" onmouseup="setMove('')">▼</div>
                <div class="j-btn" id="jb-left" ontouchstart="setTurn('l')" ontouchend="setTurn('')" onmousedown="setTurn('l')" onmouseup="setTurn('')">◀</div>
                <div class="j-btn" id="jb-right" ontouchstart="setTurn('r')" ontouchend="setTurn('')" onmousedown="setTurn('r')" onmouseup="setTurn('')">▶</div>
            </div>
            <div style="display:flex; flex-direction:column; justify-content:flex-end;">
                <button class="action-btn" onclick="gatherItem()">Raccogli</button>
                <button class="action-btn" style="background:rgba(0,255,136,0.2); border-color:#00ff88; color:#00ff88;" onclick="triggerEscape()">Fuga</button>
            </div>
        </div>
    </div>

<script>
    let scene, camera, renderer;
    let moveState = '', turnState = '';
    let pPos = { x: 0, z: 0, rot: 0 };
    let score = 0, collectibles = [];
    let touchDragging = false, lastTouch = { x: 0 };

    function startEngine() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02050b);
        scene.fog = new THREE.FogExp2(0x02050b, 0.04);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-box').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x08111d, 1.8));

        // Terreno
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(120, 120),
            new THREE.MeshStandardMaterial({ color: 0x050e1a, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Alberi procedurali
        for (let i = 0; i < 35; i++) {
            let tx = (Math.random() - 0.5) * 70, tz = (Math.random() - 0.5) * 70;
            if (Math.abs(tx) < 3 && Math.abs(tz) < 3) continue;
            
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.6, 5),
                new THREE.MeshStandardMaterial({ color: 0x0d1b2a })
            );
            trunk.position.set(tx, 2.5, tz);
            scene.add(trunk);
        }

        // Oggetti collezionabili
        for (let i = 0; i < 4; i++) {
            const cube = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x0088ff })
            );
            cube.position.set((Math.random() - 0.5) * 30, 0.4, (Math.random() - 0.5) * 30);
            scene.add(cube);
            collectibles.push(cube);
        }

        initListeners();
        loop();
    }

    function initListeners() {
        window.addEventListener('pointerdown', (e) => {
            if (e.clientY < window.innerHeight - 180) {
                touchDragging = true;
                lastTouch.x = e.clientX;
            }
        });
        window.addEventListener('pointermove', (e) => {
            if (!touchDragging) return;
            let diff = e.clientX - lastTouch.x;
            pPos.rot -= diff * 0.004;
            lastTouch.x = e.clientX;
        });
        window.addEventListener('pointerup', () => { touchDragging = false; });
    }

    function setMove(m) { moveState = m; }
    function setTurn(t) { turnState = t; }

    function loop() {
        requestAnimationFrame(loop);

        if (moveState === 'f') {
            pPos.x -= Math.sin(pPos.rot) * 0.1;
            pPos.z -= Math.cos(pPos.rot) * 0.1;
        } else if (moveState === 'b') {
            pPos.x += Math.sin(pPos.rot) * 0.1;
            pPos.z += Math.cos(pPos.rot) * 0.1;
        }

        if (turnState === 'l') pPos.rot += 0.04;
        if (turnState === 'r') pPos.rot -= 0.04;

        camera.position.x = pPos.x;
        camera.position.z = pPos.z;
        camera.rotation.y = pPos.rot;

        renderer.render(scene, camera);
    }

    function gatherItem() {
        let found = false;
        collectibles.forEach(item => {
            let dist = Math.hypot(item.position.x - pPos.x, item.position.z - pPos.z);
            if (dist < 3 && !item.userData.collected) {
                item.userData.collected = true;
                scene.remove(item);
                score++;
                document.getElementById('counter').innerText = score;
                document.getElementById('text-info').innerText = `Modulo acquisito (${score}/4).`;
                found = true;
            }
        });
        if (!found) {
            document.getElementById('text-info').innerText = "Nessun modulo nel raggio d'azione.";
        }
    }

    function triggerEscape() {
        if (score >= 4) {
            alert("Protocollo completato con successo!");
            location.reload();
        } else {
            alert(`Moduli insufficienti: ${score}/4`);
        }
    }

    window.onload = startEngine;
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>

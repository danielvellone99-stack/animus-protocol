<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Runner Simile a Subway Surfers</title>
<style>
  body{margin:0;overflow:hidden;background:#87CEEB;display:flex;justify-content:center;align-items:center;height:100vh;}
  canvas{background:#fff;border:2px solid #555;}
  #score{position:absolute;top:20px;left:20px;font:20px Arial,Helvetica,sans-serif;color:#fff;text-shadow:0 0 5px #000;}
</style>
</head>
<body>
<div id="score">0</div>
<canvas id="game" width="400" height="600"></canvas>

<script>
/* ==================== CONFIG ==================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GRAVITY = 0.6;          // accelerazione verso il basso
const JUMP_STRENGTH = -12;    // forza del salto
const MOVE_SPEED = 4;         // velocità di scorrimento del mondo
const OBSTACLE_SPEED = 4;     // velocità ostacoli (uguale a MOVE_SPEED)
const SPAWN_INTERVAL = 1500;  // ms fra due ostacoli (diminuisce col punteggio)
const PLAYER_WIDTH = 30;
const PLAYER_HEIGHT = 50;
const OBSTACLE_WIDTH = 30;
const OBSTACLE_HEIGHT = 50;

/* ==================== STATE ==================== */
let player = {x:50, y:HEIGHT-70, vx:0, vy:0, width:PLAYER_WIDTH, height:PLAYER_HEIGHT, onGround:false};
let obstacles = [];           // array di oggetti {x,y,width,height}
let lastSpawn = 0;
let score = 0;
let gameOver = false;
let keys = {};

/* ==================== INPUT ==================== */
document.addEventListener('keydown', e=>{keys[e.key]=true;});
document.addEventListener('keyup',   e=>{keys[e.key]=false;});

/* ==================== HELPERS ==================== */
function rectsIntersect(a,b){
  return a.x<a.x+b.width && a.x+a.width>b.x &&
         a.y<a.y+b.height && a.y+a.height>b.y;
}
function spawnObstacle(){
  const type = Math.random()<0.5 ? 'cactus' : 'bird';
  const obs = {
    x:WIDTH,
    y:HEIGHT-50,
    width:OBSTACLE_WIDTH,
    height:OBSTACLE_HEIGHT,
    type
  };
  obstacles.push(obs);
}
function resetGame(){
  player.y = HEIGHT-70; player.vy = 0; player.onGround = false;
  obstacles = []; score = 0; gameOver = false; lastSpawn = 0;
  document.getElementById('score').textContent = score;
}

/* ==================== GAME LOOP ==================== */
function update(delta){
  if(gameOver) return;

  // --- movimento orizzontale del mondo (e degli ostacoli) ---
  obstacles.forEach(o=>{ o.x -= MOVE_SPEED; });
  // rimuovi ostacoli fuori schermo
  while(obstacles.length && obstacles[0].x+OBSTACLE_WIDTH<0){
    obstacles.shift();
    score++;
    document.getElementById('score').textContent = score;
  }

  // --- gravità e salto del giocatore ---
  player.vy += GRAVITY;
  player.y += player.vy;

  // terra
  if(player.y+player.height>=HEIGHT){
    player.y = HEIGHT-player.height;
    player.vy = 0;
    player.onGround = true;
  }

  // salto con spazio o con tap
  if((keys[' ']||keys['ArrowUp']||keys['TouchStart']) && player.onGround){
    player.vy = JUMP_STRENGTH;
    player.onGround = false;
    keys[' ']=keys['ArrowUp']=keys['TouchStart']=false; // reset per un singolo salto
  }

  // --- collisioni ---
  for(const obs of obstacles){
    const playerRect = {x:player.x, y:player.y, width:player.width, height:player.height};
    const obsRect   = {x:obs.x, y:obs.y, width:obs.width, height:obs.height};
    if(rectsIntersect(playerRect,obsRect)){
      gameOver = true;
      alert('Game Over! Ricarica la pagina per rigiocare.');
    }
  }

  // --- aumento difficoltà (riduci intervallo di spawn) ---
  if(Date.now()-lastSpawn>SPAWN_INTERVAL-(score/20)){
    spawnObstacle();
    lastSpawn = Date.now();
  }
}

/* ==================== RENDER ==================== */
function draw(){
  // clear
  ctx.clearRect(0,0,WIDTH,HEIGHT);
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0,0,WIDTH,HEIGHT);

  // piattaforma (terra)
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(0,HEIGHT-30,WIDTH,30);

  // player
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(player.x,player.y,player.width,player.height);

  // ostacoli
  obstacles.forEach(o=>{
    ctx.fillStyle = o.type==='cactus' ? '#A52A2A' : '#FF4500';
    ctx.fillRect(o.x,o.y,o.width,o.height);
    // disegna un semplice "segno di pericolo" sopra l'ostacolo
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.fillText('!', o.x+5, o.y+15);
  });
}

/* ==================== MAIN LOOP ==================== */
let lastTime = 0;
function loop(timestamp){
  const delta = timestamp-lastTime;
  lastTime = timestamp;

  if(!gameOver) update(delta);
  draw();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ==================== TOUCH (mobile) ==================== */
canvas.addEventListener('touchstart', e=>{
  if(gameOver) return;
  keys['TouchStart'] = true;
});
canvas.addEventListener('touchend',   e=>{keys['TouchStart'] = false;});
</script>
</body>
</html>

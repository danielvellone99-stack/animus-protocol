<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SUPERHOT - Animus Protocol</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #111; font-family: 'Courier New', Courier, monospace; color: #fff; touch-action: none;
        }
        #game-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .superhot-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; padding: 20px;
        }
        .top-status {
            display: flex; justify-content: space-between; background: rgba(0,0,0,0.8);
            border: 2px solid #ff0033; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; color: #ff0033;
            letter-spacing: 2px; pointer-events: auto;
        }
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 10px; height: 10px; border: 2px solid #ff0033; border-radius: 50%; z-index: 2;
        }
        .controls-box {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 180px; z-index: 3;
            display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; pointer-events: auto;
        }
        .dpad { width: 130px; height: 130px; position: relative; background: rgba(255,0,51,0.05); border: 2px solid rgba(255,0,51,0.3); border-radius: 50%; }
        .d-btn { position: absolute; background: rgba(255,0,51,0.2); border: 2px solid #ff0033; color: #ff0033; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; }
        #d-up { top: 5px; left: 45px; width: 40px; height: 35px; }
        #d-down { bottom: 5px; left: 45px; width: 40px; height: 35px; }
        #d-left { top: 45px; left: 5px; width: 35px; height: 40px; }
        #d-right { top: 45px; right: 5px; width: 35px; height: 40px; }
        .action-fire {
            background: #ff0033; border: 2px solid #fff; color: #fff;
            padding: 15px 25px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
            box-shadow: 0 0 15px #ff0033; letter-spacing: 2px;
        }
        .action-fire:active { background: #fff; color: #ff0033; }
    </style>
</head>
<body>

    <div class="crosshair"></div>
    <div id="game-canvas"></div>

    <div class="superhot-ui">
        <div class="top-status">
            <div>SUPER... HOT...</div>
            <div>NEMICI RIMASTI: <span id="enemy-count">5</span></div>
        </div>
        <div style="background: rgba(0,0,0,0.85); border-left: 4px solid #ff0033; padding: 10px; font-size: 13px; max-width: 300px;" id="instruction">
            IL TEMPO SI MUOVE SOLO QUANDO TI MUOI TU. Elimina i nemici rossi.
        </div>
        <div class="controls-box">
            <div class="dpad">
                <div class="d-btn" id="d-up" ontouchstart="setMove('f')" ontouchend="setMove('')" onmousedown="setMove('f')" onmouseup="setMove('')">▲</div>
                <div class="d-btn" id="d-down" ontouchstart="setMove('b')" ontouchend="setMove('')" onmousedown="setMove('b')" onmouseup="setMove('')">▼</div>
                <div class="d-btn" id="d-left" ontouchstart="setTurn('l')" ontouchend="setTurn('')" onmousedown="setTurn('l')" onmouseup="setTurn('')">◀</div>
                <div class="d-btn" id="d-right" ontouchstart="setTurn('r')" ontouchend="setTurn('')" onmousedown="setTurn('r')" onmouseup="setTurn('')">▶</div>
            </div>
            <div style="display:flex; flex-direction:column; justify-content:flex-end;">
                <button class="action-fire" onclick="fireWeapon()">SPARA</button>
            </div>
        </div>
    </div>

<script>
    let scene, camera, renderer;
    let moveDir = '', turnDir = '';
    let pPos = { x: 0, z: 0, rot: 0 };
    let enemies = [];
    let bullets = [];
    let isDragging = false, lastX = 0;

    function initGame() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        scene.fog = new THREE.FogExp2(0x111111, 0.025);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        // Illuminazione stile Superhot (bianco e pulito)
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Pavimento a griglia grigia
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Generazione nemici rossi stilizzati (stile Superhot)
        const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff0033, roughness: 0.3 });
        for (let i = 0; i < 5; i++) {
            const enemyGroup = new THREE.Group();
            
            // Corpo
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), enemyMat);
            body.position.y = 0.9;
            enemyGroup.add(body);

            // Posizionamento casuale nella stanza
            let ex = (Math.random() - 0.5) * 30;
            let ez = -10 - Math.random() * 20;
            enemyGroup.position.set(ex, 0, ez);
            
            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }

        setupLookControls();
        animateLoop();
    }

    function setupLookControls() {
        window.addEventListener('pointerdown', (e) => {
            if (e.clientY < window.innerHeight - 180) {
                isDragging = true;
                lastX = e.clientX;
            }
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let delta = e.clientX - lastX;
            pPos.rot -= delta * 0.004;
            lastX = e.clientX;
        });
        window.addEventListener('pointerup', () => { isDragging = false; });
    }

    function setMove(d) { moveDir = d; }
    function setTurn(t) { turnDir = t; }

    function fireWeapon() {
        // Spara un proiettile dal giocatore verso la direzione dello sguardo
        const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const bullet = new THREE.Mesh(bulletGeo, bulletMat);
        
        bullet.position.copy(camera.position);
        bullet.userData = {
            dirX: -Math.sin(pPos.rot),
            dirZ: -Math.cos(pPos.rot)
        };
        scene.add(bullet);
        bullets.push(bullet);
    }

    function animateLoop() {
        requestAnimationFrame(animateLoop);

        // Calcolo del tempo SUPERHOT: il tempo scorre veloce solo se il giocatore si muove o spara
        let isMoving = (moveDir !== '' || turnDir !== '');
        let timeScale = isMoving ? 1.0 : 0.05; // Rallentamento estremo quando sei fermo!

        if (moveDir === 'f') {
            pPos.x -= Math.sin(pPos.rot) * 0.15;
            pPos.z -= Math.cos(pPos.rot) * 0.15;
        } else if (moveDir === 'b') {
            pPos.x += Math.sin(pPos.rot) * 0.15;
            pPos.z += Math.cos(pPos.rot) * 0.15;
        }
        if (turnDir === 'l') pPos.rot += 0.05;
        if (turnDir === 'r') pPos.rot -= 0.05;

        camera.position.x = pPos.x;
        camera.position.z = pPos.z;
        camera.rotation.y = pPos.rot;

        // Movimento rallentato dei nemici (si muovono solo se ti muovi tu)
        enemies.forEach((enemy) => {
            if (enemy.parent) {
                // Avanzano lentamente verso il giocatore
                enemy.position.z += 0.03 * timeScale;
                
                // Controllo collisione con il giocatore
                let dist = Math.hypot(enemy.position.x - pPos.x, enemy.position.z - pPos.z);
                if (dist < 1.2) {
                    alert("SEI STATO COLPITO! SUPER... HOT...");
                    location.reload();
                }
            }
        });

        // Gestione proiettili sparati dal giocatore
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.position.x += b.userData.dirX * 0.8;
            b.position.z += b.userData.dirZ * 0.8;

            // Controllo se il proiettile colpisce un nemico
            for (let j = enemies.length - 1; j >= 0; j--) {
                let en = enemies[j];
                if (en.parent) {
                    let d = Math.hypot(en.position.x - b.position.x, en.position.z - b.position.z);
                    if (d < 1.0) {
                        // Distruggi nemico e proiettile
                        scene.remove(en);
                        enemies.splice(j, 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        
                        document.getElementById('enemy-count').innerText = enemies.length;
                        
                        if (enemies.length === 0) {
                            alert("LIVELLO COMPLETATO. SUPER... HOT...");
                            location.reload();
                        }
                        break;
                    }
                }
            }
        }

        renderer.render(scene, camera);
    }

    window.onload = initGame;
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestione Attività Locale</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; background: #f9f9f9; }
        .form-group { margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #eee; }
        button { cursor: pointer; padding: 5px 10px; }
        .delete-btn { color: red; }
    </style>
</head>
<body>

    <h1>Gestione Attività</h1>
    
    <div id="form">
        <input type="text" id="title" placeholder="Titolo attività">
        <input type="date" id="due">
        <button onclick="addTask()">Aggiungi</button>
    </div>

    <table id="taskTable">
        <thead>
            <tr>
                <th>Titolo</th>
                <th>Scadenza</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody id="taskBody"></tbody>
    </table>

    <script>
        // Carica attività dal LocalStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function renderTasks() {
            const tbody = document.getElementById('taskBody');
            tbody.innerHTML = '';
            tasks.forEach((task, index) => {
                tbody.innerHTML += 
                    <tr>
                        <td>${task.title}</td>
                        <td>${task.due}</td>
                        <td><button class="delete-btn" onclick="deleteTask(${index})">Elimina</button></td>
                    </tr>
                ;
            });
        }

        function addTask() {
            const title = document.getElementById('title').value;
            const due = document.getElementById('due').value;
            if(!title) return alert("Inserisci un titolo");
            
            tasks.push({ title, due });
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
            document.getElementById('title').value = '';
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // Primo rendering
        renderTasks();
    </script>
</body>
</html>

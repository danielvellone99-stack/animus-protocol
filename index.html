<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK GPT — Realistic AI Image Engine</title>
<style>
:root{--bg:#050505;--card:#111;--line:#262626;--txt:#fff;--mut:#8a8a8a;--on:#000}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Inter,sans-serif}
body{background:var(--bg);color:var(--txt);min-height:100vh;padding:28px 16px 60px;display:flex;flex-direction:column;align-items:center}
header{text-align:center;margin-bottom:24px}
h1{font-size:3.4rem;font-weight:900;letter-spacing:6px;
   background:linear-gradient(180deg,#fff 20%,#666);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.badge{background:#161616;border:1px solid var(--line);color:#aaa;padding:4px 12px;border-radius:20px;font-size:.7rem;letter-spacing:1px;text-transform:uppercase}
.badge.ok{color:#7dffa8;border-color:#1f4d33}
.badge.wait{color:#ffd479;border-color:#4d3c1f}
.layout{width:100%;max-width:1200px;display:grid;grid-template-columns:340px 1fr;gap:22px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.lbl{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;margin:0 0 6px;display:block}
textarea,input[type=text],input[type=number],select{width:100%;background:#080808;border:1px solid var(--line);
  color:var(--txt);padding:12px 14px;border-radius:12px;font-size:.92rem;outline:none;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:#5a5a5a}
.grp{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;align-items:center;gap:9px;font-size:.85rem;color:#cfcfcf;cursor:pointer;user-select:none;padding:6px 0}
.tog input{accent-color:#fff;width:16px;height:16px;cursor:pointer}
.btn{background:var(--txt);color:var(--on);border:none;padding:14px;border-radius:12px;font-weight:800;
     letter-spacing:1px;cursor:pointer;transition:.15s;text-transform:uppercase;font-size:.9rem}
.btn:hover{background:#d4d4d4}.btn:disabled{background:#333;color:#777;cursor:not-allowed}
.btn.ghost{background:#1a1a1a;color:#fff;border:1px solid #3d3d3d}
.btn.ghost:hover{background:#2b2b2b}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1;min-width:110px;padding:11px;font-size:.78rem}
.stage{background:#0c0c0c;border:1px solid var(--line);border-radius:22px;min-height:520px;
       display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:14px}
#main{max-width:100%;max-height:70vh;border-radius:14px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.9)}
.ph{color:#3f3f3f;font-size:1.05rem;text-align:center;line-height:1.7}
.load{display:none;flex-direction:column;align-items:center;gap:14px;color:var(--mut)}
.spin{width:44px;height:44px;border:3px solid #232323;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#status{font-size:.85rem;color:var(--mut);min-height:20px;margin-top:12px;text-align:center}
.gal{width:100%;max-width:1200px;margin-top:34px}
.gal h2{font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ggrid img{width:100%;height:190px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer;transition:.2s;background:#0d0d0d}
.ggrid img:hover{transform:scale(1.03);border-color:#777}
#cd{font-variant-numeric:tabular-nums}
.fileUp{margin-top:6px}
</style>
</head>
<body>

<header>
  <h1>BLACK GPT</h1>
  <div class="badges">
    <span class="badge ok">Flux Engine</span>
    <span class="badge ok">Senza watermark</span>
    <span class="badge ok">Gratis & illimitato</span>
    <span class="badge wait" id="cdBadge">Pronto</span>
  </div>
</header>

<div class="layout">

  <!-- CONTROLLI -->
  <div class="panel">
    <div class="grp">
      <label class="lbl">Prompt — cosa vuoi creare</label>
      <textarea id="prompt" rows="3" placeholder="es. un vecchio pescatore sulla spiaggia al tramonto"></textarea>
    </div>

    <div class="grp">
      <label class="lbl">Negative prompt (cosa evitare)</label>
      <input type="text" id="neg" value="blurry, low quality, watermark, text, logo, cartoon, deformed hands, extra fingers, distorted face">
    </div>

    <div class="grp">
      <label class="lbl">Stile fotografico</label>
      <select id="style">
        <option value="raw photo, 8k uhd, dslr, soft natural lighting, film grain, shallow depth of field">📷 Foto reale (standard)</option>
        <option value="professional studio portrait, 85mm lens, f/1.4, bokeh, dramatic rim lighting, hyper detailed skin">🧑 Ritratto perfetto</option>
        <option value="cinematic still, anamorphic lens, color graded, movie scene, IMAX 70mm, dramatic lighting">🎬 Cinematografico</option>
        <option value="national geographic wildlife photography, macro details, golden hour, sharp focus">🦁 Natura / animali</option>
        <option value="product photography, studio softbox, white seamless background, commercial advertising">📦 Prodotto / e-commerce</option>
        <option value="neon cyberpunk city, volumetric fog, teal and orange grade, blade runner atmosphere">🌃 Cyberpunk / notte</option>
        <option value="35mm analog film, kodak portra 400, vintage grain, nostalgic tones">🎞️ Analogico vintage</option>
        <option value="">⚪ Nessuno (prompt puro)</option>
      </select>
    </div>

    <div class="row2">
      <div class="grp">
        <label class="lbl">Modello</label>
        <select id="model">
          <option value="flux">FLUX (realismo max)</option>
          <option value="turbo">Turbo (veloce)</option>
        </select>
      </div>
      <div class="grp">
        <label class="lbl">Formato</label>
        <select id="size">
          <option value="1024x1024">Quadrato 1:1</option>
          <option value="832x1216">Verticale 9:16</option>
          <option value="1216x832">Orizzontale 16:9</option>
          <option value="896x1152">Ritratto 3:4</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="grp">
        <label class="lbl">Seed (0 = casuale)</label>
        <input type="number" id="seed" value="0" min="0">
      </div>
      <div class="grp">
        <label class="lbl">Quantità (max 4)</label>
        <select id="batch">
          <option value="1">1 immagine</option>
          <option value="2">2 immagini</option>
          <option value="3">3 immagini</option>
          <option value="4">4 immagini</option>
        </select>
      </div>
    </div>

    <label class="tog"><input type="checkbox" id="enhance" checked>✨ Auto-enhance prompt (motore Pollinations)</label>
    <label class="tog"><input type="checkbox" id="boost" checked>🔥 Booster realismo (tag tecnici extra)</label>
    <label class="tog"><input type="checkbox" id="lockseed">🔒 Blocca seed (riproducibile)</label>

    <div class="grp fileUp">
      <label class="lbl">Immagine di riferimento (opzionale)</label>
      <input type="file" id="refFile" accept="image/*">
    </div>

    <button class="btn" id="go" style="width:100%" onclick="run()">⚡ Genera</button>
    <div class="btnrow">
      <button class="btn ghost" onclick="dice()">🎲 Idea casuale</button>
      <button class="btn ghost" onclick="copyPrompt()">⧉ Copia prompt</button>
    </div>
  </div>

  <!-- RISULTATO -->
  <div>
    <div class="stage">
      <p class="ph" id="ph">Scrivi un'idea e premi GENERA.<br>L'immagine apparirà qui.</p>
      <div class="load" id="load"><div class="spin"></div><p id="loadTxt">Elaborazione neurale...</p></div>
      <img id="main" alt="Immagine Black GPT">
    </div>
    <div id="status"></div>
    <div class="btnrow">
      <a class="btn ghost" id="dl" download="BlackGPT.jpg" style="text-align:center;text-decoration:none">⬇ Scarica HD</a>
      <button class="btn ghost" id="upBtn" onclick="upscale()" disabled>🔍 Upscale 2x</button>
      <button class="btn ghost" id="varBtn" onclick="variation()" disabled>🎨 Variazione</button>
    </div>
  </div>
</div>

<div class="gal">
  <h2><span>Le tue creazioni</span><span id="cnt">0</span></h2>
  <div class="ggrid" id="grid"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const BOOST = "photorealistic, hyperrealistic, ultra detailed, masterpiece, professional photography, sharp focus";
let cur = null; // ultima configurazione
let cooldownUntil = 0;

/* ---------- COSTRUZIONE URL ---------- */
function buildUrl(p, opts){
  let full = p;
  if ($('boost').checked && opts.style) full += ", " + opts.style;
  if ($('boost').checked) full += ", " + BOOST;
  const q = new URLSearchParams({
    width: opts.w, height: opts.h, seed: opts.seed, model: opts.model, nologo: true
  });
  if ($('enhance').checked) q.set('enhance','true');
  if (opts.neg) q.set('negative_prompt', opts.neg);
  if (opts.ref) q.set('image', opts.ref);
  return "https://image.pollinations.ai/prompt/" + encodeURIComponent(full) + "?" + q.toString();
}

function readCfg(){
  const [w,h] = $('size').value.split('x').map(Number);
  return {
    prompt: $('prompt').value.trim(),
    neg: $('neg').value.trim(),
    style: $('style').value,
    model: $('model').value,
    w, h,
    ref: localStorage.getItem('bgpt_ref') || '',
    lock: $('lockseed').checked
  };
}

/* ---------- GENERAZIONE CON GESTIONE ATTESA ---------- */
async function fetchWithWait(url, cb){
  let attempt = 0;
  while (attempt < 12){
    const now = Date.now();
    if (now < cooldownUntil){
      const s = Math.ceil((cooldownUntil - now)/1000);
      setStatus(`⏳ Rispettiamo il limite del server: riprovo tra ${s}s...`);
      $('cdBadge').textContent = 'Attesa ' + s + 's';
      await sleep(4000);
      attempt++; continue;
    }
    try {
      setStatus(cb ? cb(attempt) : 'Generazione in corso...');
      const r = await fetch(url);
      if (r.status === 429){
        cooldownUntil = Date.now() + 45000;
        attempt++; continue;
      }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      cooldownUntil = Date.now() + 8000; // pausa educata tra richieste
      return await r.blob();
    } catch(e){
      attempt++;
      await sleep(3000);
    }
  }
  throw new Error('Il server è occupato. Riprova fra un minuto.');
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function setStatus(t){ $('status').textContent = t; }

async function run(){
  const cfg = readCfg();
  if (!cfg.prompt) return alert('Scrivi prima una descrizione!');
  $('go').disabled = true;
  $('ph').style.display='none';
  $('load').style.display='flex';
  $('main').style.display='none';

  const n = parseInt($('batch').value);
  for (let i=0; i<n; i++){
    const seed = cfg.lock ? (parseInt($('seed').value)||12345) : Math.floor(Math.random()*9999999);
    const opts = {...cfg, seed};
    const url = buildUrl(cfg.prompt, opts);
    try {
      const blob = await fetchWithWait(url, a => `Generazione ${i+1}/${n} — il motore Flux sta disegnando${'.'.repeat((a%3)+1)}`);
      const ou = URL.createObjectURL(blob);
      show(ou, {prompt: cfg.prompt, style: opts.style, model: opts.model, w: opts.w, h: opts.h, seed});
    } catch(e){
      setStatus('⚠ ' + e.message);
    }
  }
  $('load').style.display='none';
  $('go').disabled = false;
  $('cdBadge').textContent = 'Pronto';
}

function show(url, meta){
  $('main').src = url; $('main').style.display='block';
  $('dl').href = url; $('dl').download = `BlackGPT-${meta.seed}.jpg`;
  $('upBtn').disabled = false; $('varBtn').disabled = false;
  cur = meta;
  setStatus('✅ Pronta — nessuna filigrana');
  addGallery(meta, url);
}

function upscale(){
  if(!cur) return;
  const opts = {prompt: cur.prompt, neg: $('neg').value, style: cur.style, model: cur.model,
                w: Math.min(cur.w*2, 2048), h: Math.min(cur.h*2, 2048), seed: cur.seed, ref: cur.ref||''};
  doAction(buildUrl(cur.prompt, opts), 'Upscaling in corso (2x)...', opts);
}

function variation(){
  if(!cur) return;
  const seed = Math.floor(Math.random()*9999999);
  const opts = {prompt: cur.prompt, neg: $('neg').value, style: cur.style, model: cur.model,
                w: cur.w, h: cur.h, seed, ref: cur.ref||''};
  doAction(buildUrl(cur.prompt, opts), 'Nuova variazione...', opts);
}

async function doAction(url, msg, opts){
  $('load').style.display='flex'; setStatus(msg);
  try{
    const blob = await fetchWithWait(url);
    show(URL.createObjectURL(blob), {prompt: opts.prompt, style: opts.style, model: opts.model, w: opts.w, h: opts.h, seed: opts.seed});
  }catch(e){ setStatus('⚠ '+e.message); }
  $('load').style.display='none';
}

/* ---------- IMMAGINE DI RIFERIMENTO ---------- */
$('refFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ localStorage.setItem('bgpt_ref', r.result); setStatus('🖼️ Reference caricata: verrà usata nella prossima generazione'); };
  r.readAsDataURL(f);
});

/* ---------- IDEE CASUALI ---------- */
const IDEAS = [
 "Un leone anziano seduto su una sedia di velluto rosso in un teatro abbandonato",
 "Un barista robot che prepara caffè in un locale anni '50, luce neon",
 "Una ballerina di balletto sotto la neve, motion blur, Parigi di notte",
 "Un pescatore con la barba bianca che ripara una rete al tramonto",
 "Una biblioteca infinita con scale a chiocciola, luce dorata dalle finestre",
 "Un lupo artico che cammina su un iceberg, cieli aurora boreale",
 "Una chef stellata che impasta in una cucina professionale, vapore e luce calda",
 "Un samurai nel Giappone feudale sotto la pioggia, kimono rosso"
];
function dice(){ $('prompt').value = IDEAS[Math.floor(Math.random()*IDEAS.length)]; }
function copyPrompt(){
  let p = $('prompt').value;
  if ($('boost').checked) p += ", " + ($('style').value ? $('style').value + ", " : "") + BOOST;
  navigator.clipboard.writeText(p); setStatus('📋 Prompt completo copiato!');
}

/* ---------- GALLERIA PERSISTENTE ---------- */
const KEY='bgpt_gallery';
function loadGallery(){ try{ return JSON.parse(localStorage.getItem(KEY))||[] }catch(e){ return [] } }
function saveGallery(g){ localStorage.setItem(KEY, JSON.stringify(g.slice(0,40))); }
function addGallery(meta, url){
  const g = loadGallery();
  g.unshift({...meta, url, ts: Date.now()});
  saveGallery(g); renderGallery();
}
function renderGallery(){
  const g = loadGallery();
  $('cnt').textContent = g.length;
  $('grid').innerHTML = '';
  g.forEach(m=>{
    const img = document.createElement('img');
    img.src = m.url; img.title = m.prompt; img.loading='lazy';
    img.onclick = ()=>{ show(m.url, m); window.scrollTo({top:0,behavior:'smooth'}); };
    $('grid').appendChild(img);
  });
}
renderGallery();
</script>
</body>
</html>

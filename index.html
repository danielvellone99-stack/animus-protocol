<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grisolia Runner - Batman Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a14;color:#fff;font-family:'Fredoka',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#game{position:relative;width:100%;max-width:400px;height:100%;max-height:750px;background:linear-gradient(180deg,#1e1b4b 0%,#312e81 30%,#0a0a14 100%);overflow:hidden;border:3px solid #facc15;box-shadow:0 0 30px #facc1588}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.badge{background:#000a;color:#facc15;border:2px solid #facc15;padding:6px 12px;border-radius:99px;font-weight:900;font-size:14px}
#menu{position:absolute;inset:0;background:linear-gradient(180deg,#1e1b4be6,#0a0a14f0);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px}
h1{font-size:42px;color:#facc15;text-shadow:0 4px 0 #000,0 0 20px #facc15;letter-spacing:2px;line-height:0.9}
h1 span{color:#fff}
.btn{background:#facc15;color:#000;border:0;padding:14px 28px;border-radius:99px;font-weight:900;font-size:18px;font-family:'Fredoka',sans-serif;cursor:pointer;box-shadow:0 6px 0 #a68a0a,0 0 20px #facc15aa;transition:.1s;margin:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a68a0a}
.btn2{background:#fff;color:#000;box-shadow:0 6px 0 #999}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;width:100%;max-width:320px}
.skin{background:#ffffff11;border:2px solid #ffffff33;border-radius:16px;padding:12px;cursor:pointer}
.skin.on{border-color:#facc15;background:#facc1522;box-shadow:0 0 15px #facc15aa}
.skin b{display:block;font-size:13px;margin-top:6px}
.dot{width:40px;height:40px;border-radius:50%;margin:0 auto}
</style>
</head>
<body>
<div id="game">
<canvas id="c" width="400" height="750"></canvas>
<div id="ui">
<div class="badge" id="sc">0</div>
<div class="badge" id="co">💰 0</div>
</div>
<div id="menu">
<h1>GRISOLIA<br><span>RUNNER</span></h1>
<p style="margin:12px 0;color:#facc15;font-size:14px">BATMAN EDITION • TAP PER SALTARE</p>
<button class="btn" onclick="start()">▶ GIOCA</button>
<button class="btn btn2" onclick="openShop()">🛒 SHOP</button>
<div id="shop" style="display:none;width:100%">
<div class="shop" id="skins"></div>
<button class="btn btn2" onclick="closeShop()">CHIUDI</button>
</div>
<p style="margin-top:14px;font-size:11px;opacity:.6">Monete salvate • Record: <span id="rec">0</span></p>
</div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W=400,H=750,player={x:60,y:600,w:36,h:36,vy:0,j:false},obs=[],coins=[],score=0,coin=parseInt(localStorage.getItem('gr_co')||'0'),rec=parseInt(localStorage.getItem('gr_rec')||'0'),run=false,skinId=localStorage.getItem('gr_skin')||'bat',skins=[
{id:'bat',n:'BATMAN',c:'#facc15',e:'🦇'},
{id:'def',n:'GRISOLIA',c:'#22c55e',e:'🏃'},
{id:'spi',n:'SPIDER',c:'#ef4444',e:'🕷️'},
{id:'fla',n:'FLASH',c:'#ef4444',e:'⚡'},
{id:'ice',n:'GHIACCIO',c:'#38bdf8',e:'❄️'},
{id:'gol',n:'GOLD',c:'#facc15',e:'👑'}
],cost={bat:0,def:0,spi:50,fla:100,ice:150,gol:300},owned=JSON.parse(localStorage.getItem('gr_own')||'["bat","def"]');
document.getElementById('co').innerText='💰 '+coin;
document.getElementById('rec').innerText=rec;
function openShop(){document.getElementById('shop').style.display='block';renderSkins()}
function closeShop(){document.getElementById('shop').style.display='none'}
function renderSkins(){
 let h='';skins.forEach(s=>{
  let has=owned.includes(s.id),on=skinId===s.id;
  h+=`<div class="skin ${on?'on':''}" onclick="buy('${s.id}')"><div class="dot" style="background:${s.c}"></div><b>${s.e} ${s.n}</b><small style="font-size:10px;opacity:.7">${has?(on?'EQUIPAGGIATO':'USA'):(s.c==='#facc15'&&s.id==='bat'?'GRATIS':cost[s.id]+' 💰')}</small></div>`;
 });document.getElementById('skins').innerHTML=h;
}
function buy(id){
 if(!owned.includes(id)){
  if(coin<cost[id]){alert('Servono '+cost[id]+' monete!');return}
  coin-=cost[id];owned.push(id);
  localStorage.setItem('gr_co',coin);localStorage.setItem('gr_own',JSON.stringify(owned));
  document.getElementById('co').innerText='💰 '+coin;
 }
 skinId=id;localStorage.setItem('gr_skin',id);renderSkins();
}
function start(){
 run=true;score=0;obs=[];coins=[];player.y=600;player.vy=0;
 document.getElementById('menu').style.display='none';
 loop();
}
function gameOver(){
 run=false;
 if(score>rec){rec=Math.floor(score);localStorage.setItem('gr_rec',rec)}
 document.getElementById('rec').innerText=rec;
 document.getElementById('menu').style.display='flex';
 document.getElementById('menu').querySelector('h1').innerHTML='GAME<br><span>OVER</span>';
}
function loop(){
 if(!run) return;
 score+=0.15;
 if(Math.random()<0.025){obs.push({x:W+20,y:630,w:30+Math.random()*20,h:30+Math.random()*30})}
 if(Math.random()<0.02){coins.push({x:W+20,y:500+Math.random()*120,r:10,taken:false})}
 player.vy+=0.7;player.y+=player.vy;
 if(player.y>610){player.y=610;player.vy=0;player.j=false}
 obs.forEach(o=>o.x-=4+score/100);
 coins.forEach(o=>o.x-=4+score/100);
 obs=obs.filter(o=>o.x>-50);
 coins=coins.filter(o=>!o.taken&&o.x>-30);
 for(let o of obs){if(player.x+player.w>o.x&&player.x<o.x+o.w&&player.y+player.h>o.y){gameOver();return}}
 for(let o of coins){
  let dx=(player.x+player.w/2)-(o.x),dy=(player.y+player.h/2)-(o.y);
  if(Math.sqrt(dx*dx+dy*dy)<28){o.taken=true;coin++;localStorage.setItem('gr_co',coin);document.getElementById('co').innerText='💰 '+coin}
 }
 X.clearRect(0,0,W,H);
 X.fillStyle='#111';X.fillRect(0,650,W,100);
 X.fillStyle='#facc1533';X.fillRect(0,648,W,4);
 obs.forEach(o=>{X.fillStyle='#1f1f2e';X.fillRect(o.x,o.y,o.w,o.h);X.fillStyle='#facc15';X.fillRect(o.x,o.y-4,o.w,4)});
 coins.forEach(o=>{X.beginPath();X.arc(o.x,o.y,o.r,0,Math.PI*2);X.fillStyle='#facc15';X.fill();X.fillStyle='#000';X.font='10px Fredoka';X.fillText('€',o.x-4,o.y+3)});
 let sk=skins.find(s=>s.id===skinId)||skins[0];
 X.fillStyle=sk.c;X.fillRect(player.x,player.y,player.w,player.h);
 X.fillStyle='#000';X.font='20px serif';X.fillText(sk.e,player.x+6,player.y+26);
 X.fillStyle='#0006';X.fillRect(player.x+4,610,player.w-8,6);
 document.getElementById('sc').innerText=Math.floor(score);
 requestAnimationFrame(loop);
}
C.addEventListener('touchstart',e=>{e.preventDefault();if(run&&!player.j){player.vy=-14;player.j=true}else if(!run) start()},{passive:false});
C.addEventListener('mousedown',()=>{if(run&&!player.j){player.vy=-14;player.j=true}});
window.addEventListener('keydown',e=>{if(e.code==='Space'){if(run&&!player.j){player.vy=-14;player.j=true}else if(!run) start()}});
renderSkins();
</script>
</body>
</html>

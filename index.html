<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Forest Surfers</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #1a4d2e; font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif; color: #fff; touch-action: none;
        }
        #game-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Interfaccia stile Subway Surfers (HUD) */
        .hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; padding: 20px;
        }
        .subway-header {
            display: flex; justify-content: space-between; align-items: flex-start; width: 100%;
        }
        .score-pill {
            background: rgba(0, 0, 0, 0.5); border: 3px solid #ffcc00; border-radius: 20px;
            padding: 8px 18px; font-size: 22px; font-weight: 900; color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-shadow: 2px 2px 0px #000;
        }
        .coins-pill {
            background: rgba(0, 0, 0, 0.5); border: 3px solid #ff9900; border-radius: 20px;
            padding: 8px 18px; font-size: 22px; font-weight: 900; color: #ffcc00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-shadow: 2px 2px 0px #000;
            display: flex; align-items: center; gap: 8px;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            background: rgba(10, 30, 20, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 15px; box-sizing: border-box;
            overflow-y: auto;
        }
        .title { font-size: 32px; font-weight: 900; color: #ffcc00; text-shadow: 3px 3px 0px #ff3300, 0 0 20px rgba(255,204,0,0.6); margin-bottom: 2px; letter-spacing: 2px; }
        .subtitle { font-size: 13px; color: #a2ffce; margin-bottom: 20px; font-weight: bold; text-transform: uppercase; }
        
        .btn-main {
            background: linear-gradient(180deg, #ffcc00, #ff6600); border: 3px solid #fff; color: #fff;
            padding: 15px 45px; font-size: 20px; font-weight: 900; border-radius: 30px; cursor: pointer;
            box-shadow: 0 6px 0px #b33600, 0 10px 20px rgba(0,0,0,0.4); margin-top: 15px; transition: 0.1s; pointer-events: auto; z-index: 15;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0px #b33600, 0 5px 10px rgba(0,0,0,0.4); }

        .shop-container {
            display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; max-width: 350px;
        }
        .char-card {
            background: rgba(20, 50, 30, 0.9); border: 3px solid #2ecc71;
            border-radius: 15px; padding: 10px; width: 100px; text-align: center; cursor: pointer; pointer-events: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .char-card.selected { border-color: #ffcc00; background: rgba(40, 90, 50, 0.95); transform: scale(1.05); box-shadow: 0 0 15px rgba(255,204,0,0.5); }
        .char-card h4 { margin: 4px 0; font-size: 13px; color: #fff; font-weight: 900; }
        .char-card p { font-size: 10px; color: #a2ffce; margin: 3px 0; font-weight: bold; }

        .tutorial-hint {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            font-size: 12px; color: rgba(255,255,255,0.8); pointer-events: none; font-weight: bold;
            text-shadow: 1px 1px 2px #000; padding: 0 10px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="game-canvas"></div>

    <div class="hud" id="game-hud" style="display:none;">
        <div class="subway-header">
            <div class="score-pill"><span id="score">0</span>m</div>
            <div class="coins-pill">🪙 <span id="coins">0</span></div>
        </div>
        <div class="tutorial-hint">⬅️ Scorri o Usa Frecce per muoverti • ⬆️ Salta • ⬇️ Scivola ⬇️</div>
    </div>

    <div class="overlay" id="main-menu">
        <div class="title">FOREST SURFERS</div>
        <div class="subtitle">Fuggi nel bosco incantato!</div>
        
        <div style="font-size: 14px; margin-bottom: 10px; color: #ffcc00; font-weight: bold;">Monete: <span id="menu-coins">0</span></div>
        
        <div class="shop-container">
            <div class="char-card selected" id="c-0" onclick="selectCharacter(0)">
                <h4>Jake Forest</h4>
                <p>Standard</p>
                <p style="color:#00ff88">ATTIVO</p>
            </div>
            <div class="char-card" id="c-1" onclick="selectCharacter(1)">
                <h4>Ninja Green</h4>
                <p>+20% Monete</p>
                <p id="c1-status" style="color:#ffcc00">100 Monete</p>
            </div>
            <div class="char-card" id="c-2" onclick="selectCharacter(2)">
                <h4>Cyber Boy</h4>
                <p>Super Salto</p>
                <p id="c2-status" style="color:#ffcc00">250 Monete</p>
            </div>
        </div>

        <button class="btn-main" onclick="startGame()">GIORA ORA</button>
    </div>

    <div class="overlay" id="main-menu-compat" style="display:none;"></div>

    <div class="overlay" id="game-over-screen" style="display:none;">
        <div class="title" style="color:#ff3333; text-shadow: 3px 3px 0px #660000;">GAME OVER</div>
        <div class="subtitle">Sei stato acciuffato!</div>
        
        <div style="background: rgba(20,50,30,0.9); border: 3px solid #ffcc00; padding: 15px; border-radius: 15px; margin-bottom: 20px; width: 220px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            <p style="margin: 8px 0; font-weight: bold;">Distanza: <span id="final-score" style="color:#00ff88">0</span>m</p>
            <p style="margin: 8px 0; font-weight: bold;">Monete: <span id="final-coins" style="color:#ffcc00">0</span></p>
        </div>

        <button class="btn-main" onclick="restartGame()">RIPROVA</button>
    </div>

<script>
    let scene, camera, renderer;
    let player, lane = 1, targetX = 0;
    let isJumping = false, jumpVel = 0, isCrouching = false, crouchTimer = 0;
    let obstacles = [], coins = [], trackSegments = [], sceneryElements = [];
    let gameActive = false, score = 0, totalCoins = 0, highScore = 0;
    
    // Velocità ridotta e stabile per evitare lag e problemi di salto
    let gameSpeed = 0.16; 

    let currentSkin = 0;
    let unlockedChars = [true, false, false];
    let charPrices = [0, 100, 250];

    if (localStorage.getItem('forest_coins')) totalCoins = parseInt(localStorage.getItem('forest_coins'));
    if (localStorage.getItem('forest_high')) highScore = parseInt(localStorage.getItem('forest_high'));

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2980b9);
        scene.fog = new THREE.FogExp2(0x2980b9, 0.015);

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.0, 5.0);
        camera.lookAt(0, 1.0, -5);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('game-canvas').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        dirLight.position.set(10, 30, 20);
        scene.add(dirLight);

        for (let i = -2; i < 15; i++) {
            createTrackSegment(i * 10);
        }

        buildPlayer();
        setupControls();
        updateMenuUI();

        window.addEventListener('resize', onWindowResize);
        animate();
    }

    // Costruzione personaggi personalizzati e coloratissimi
    function buildPlayer() {
        if (player) scene.remove(player);
        
        const group = new THREE.Group();
        let shirtColor = 0xe74c3c, pantsColor = 0x34495e, skinColor = 0xffdbac;

        if (currentSkin === 1) { // Ninja Green
            shirtColor = 0x27ae60; pantsColor = 0x111111; skinColor = 0xdddddd;
        } else if (currentSkin === 2) { // Cyber Boy
            shirtColor = 0x00ffff; pantsColor = 0x8e44ad; skinColor = 0xff00ff;
        }

        const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor, roughness: 0.3 });
        const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.5 });
        const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.4 });

        // Busto
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.65, 0.3), shirtMat);
        torso.position.y = 0.75;
        group.add(torso);

        // Testa
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), skinMat);
        head.position.y = 1.3;
        group.add(head);

        // Accessorio testa (Cappello o Capelli)
        const accMat = new THREE.MeshStandardMaterial({ color: currentSkin === 0 ? 0xf1c40f : (currentSkin === 1 ? 0x2ecc71 : 0xff0055) });
        const acc = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.12, 0.38), accMat);
        acc.position.y = 1.5;
        group.add(acc);

        // Gambe
        const legGeo = new THREE.BoxGeometry(0.18, 0.45, 0.2);
        const leftLeg = new THREE.Mesh(legGeo, pantsMat);
        leftLeg.position.set(-0.13, 0.25, 0);
        group.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, pantsMat);
        rightLeg.position.set(0.13, 0.25, 0);
        group.add(rightLeg);

        player = group;
        player.position.set(0, 0, 0);
        scene.add(player);
    }

    function createTrackSegment(zPos) {
        const trackGeo = new THREE.PlaneGeometry(8, 10);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.8 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.set(0, 0, zPos);
        scene.add(track);
        trackSegments.push(track);

        const pathGeo = new THREE.PlaneGeometry(7.0, 10);
        const pathMat = new THREE.MeshStandardMaterial({ color: 0xd35400, roughness: 0.9 });
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, 0.01, zPos);
        scene.add(path);
        trackSegments.push(path);

        if (zPos % 20 === 0) {
            spawnTree(-5.5, zPos);
            spawnTree(5.5, zPos);
        }

        if (zPos < -20 && Math.random() < 0.6) {
            spawnObstacleAndCoins(zPos);
        }
    }

    function spawnTree(x, z) {
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8e44ad, roughness: 0.9 });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.5 });

        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 2.5, 6), trunkMat);
        trunk.position.set(x, 1.25, z);
        scene.add(trunk);
        sceneryElements.push(trunk);

        const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.8, 3.5, 6), leavesMat);
        leaves.position.set(x, 3.2, z);
        scene.add(leaves);
        sceneryElements.push(leaves);
    }

    function spawnObstacleAndCoins(z) {
        let obsLane = Math.floor(Math.random() * 3);
        let xPos = (obsLane - 1) * 2.2;

        let isLow = Math.random() > 0.4;
        let obsGeo = isLow ? new THREE.BoxGeometry(2.0, 0.6, 0.7) : new THREE.BoxGeometry(1.8, 1.8, 0.9);
        let obsMat = new THREE.MeshStandardMaterial({ color: isLow ? 0x95a5a6 : 0xe67e22, roughness: 0.6 });
        let obs = new THREE.Mesh(obsGeo, obsMat);
        
        obs.position.set(xPos, isLow ? 0.3 : 0.9, z);
        obs.userData = { type: isLow ? 'low' : 'high', lane: obsLane };
        scene.add(obs);
        obstacles.push(obs);

        // Monete lungo la corsia libera
        for (let l = 0; l < 3; l++) {
            if (l !== obsLane && Math.random() < 0.6) {
                let coin = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.3, 0.1, 12),
                    new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0xf1c40f, emissiveIntensity: 0.8 })
                );
                coin.rotation.x = Math.PI / 2;
                coin.position.set((l - 1) * 2.2, 0.8, z + (Math.random() - 0.5) * 3);
                scene.add(coin);
                coins.push(coin);
            }
        }
    }

    // Controlli touch ultra-reattivi (risolve il problema del salto non registrato)
    let touchStartX = 0, touchStartY = 0;
    function setupControls() {
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            if (!gameActive) return;
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && lane < 2) lane++;
                else if (diffX < -30 && lane > 0) lane--;
            } else {
                if (diffY < -30 && !isJumping) {
                    isJumping = true;
                    jumpVel = currentSkin === 2 ? 0.25 : 0.21; // Salto calibrato e fluido
                } else if (diffY > 30 && !isCrouching) {
                    isCrouching = true;
                    crouchTimer = 35;
                    player.scale.y = 0.5;
                }
            }
        }, {passive: true});

        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && lane > 0) lane--;
            if (e.key === 'ArrowRight' && lane < 2) lane++;
            if (e.key === 'ArrowUp' && !isJumping) { isJumping = true; jumpVel = 0.21; }
            if (e.key === 'ArrowDown' && !isCrouching) { isCrouching = true; crouchTimer = 35; player.scale.y = 0.5; }
        });
    }

    function selectCharacter(index) {
        if (!unlockedChars[index]) {
            if (totalCoins >= charPrices[index]) {
                totalCoins -= charPrices[index];
                localStorage.setItem('forest_coins', totalCoins);
                unlockedChars[index] = true;
                document.getElementById(`c${index}-status`).innerText = "SBLOCCATO";
                document.getElementById(`c${index}-status`).style.color = "#00ff88";
            } else {
                alert("Monete non sufficienti!");
                return;
            }
        }
        currentSkin = index;
        document.querySelectorAll('.char-card').forEach((c, idx) => {
            c.classList.remove('selected');
            if (idx === index) c.classList.add('selected');
        });
        buildPlayer();
        updateMenuUI();
    }

    function updateMenuUI() {
        document.getElementById('menu-coins').innerText = totalCoins;
        unlockedChars.forEach((unlocked, idx) => {
            if (unlocked && idx > 0) {
                document.getElementById(`c${idx}-status`).innerText = "SBLOCCATO";
                document.getElementById(`c${idx}-status`).style.color = "#00ff88";
            }
        });
    }

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-hud').style.display = 'flex';
        score = 0;
        gameSpeed = 0.16; // Partenza fluida e controllata
        lane = 1;
        gameActive = true;
    }

    function restartGame() {
        document.getElementById('game-over-screen').style.display = 'none';
        obstacles.forEach(o => scene.remove(o));
        coins.forEach(c => scene.remove(c));
        obstacles = [];
        coins = [];
        startGame();
    }

    function animate() {
        requestAnimationFrame(animate);

        if (gameActive) {
            score += Math.floor(gameSpeed * 8);
            gameSpeed += 0.00004; // Aumento della velocità molto graduale per non appesantire il gioco

            document.getElementById('score').innerText = score;
            document.getElementById('coins').innerText = totalCoins;

            targetX = (lane - 1) * 2.2;
            player.position.x += (targetX - player.position.x) * 0.25;

            if (isJumping) {
                player.position.y += jumpVel;
                jumpVel -= 0.014;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                }
            }

            if (isCrouching) {
                crouchTimer--;
                if (crouchTimer <= 0) {
                    isCrouching = false;
                    player.scale.y = 1.0;
                }
            }

            trackSegments.forEach(seg => {
                seg.position.z += gameSpeed;
                if (seg.position.z > 15) seg.position.z -= 170;
            });

            sceneryElements.forEach(elem => {
                elem.position.z += gameSpeed;
                if (elem.position.z > 15) elem.position.z -= 170;
            });

            // Gestione collisioni precisa e permissiva
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += gameSpeed;

                let dist = Math.abs(obs.position.z - player.position.z);
                if (dist < 0.9 && obs.userData.lane === lane) {
                    let hit = true;
                    if (obs.userData.type === 'low' && isCrouching) hit = false;
                    if (obs.userData.type === 'high' && isJumping && player.position.y > 0.6) hit = false;

                    if (hit) {
                        gameOver();
                    }
                }

                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.position.z += gameSpeed;
                c.rotation.y += 0.06;

                let dist = Math.hypot(c.position.x - player.position.x, c.position.z - player.position.z);
                if (dist < 1.1 && Math.abs(player.position.y - c.position.y) < 1.5) {
                    scene.remove(c);
                    coins.splice(i, 1);
                    totalCoins += (currentSkin === 1 ? 2 : 1);
                    localStorage.setItem('forest_coins', totalCoins);
                }

                if (c.position.z > 10) {
                    scene.remove(c);
                    coins.splice(i, 1);
                }
            }

            if (Math.random() < 0.08) {
                createTrackSegment(-150);
            }
        }

        renderer.render(scene, camera);
    }

    function gameOver() {
        gameActive = false;
        document.getElementById('game-hud').style.display = 'none';
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-coins').innerText = totalCoins;
        document.getElementById('game-over-screen').style.display = 'flex';
        updateMenuUI();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

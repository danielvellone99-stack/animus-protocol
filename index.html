<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Gestore di Attività – Versione Stand‑alone</title>
<style>
  /* ---------- Layout ---------- */
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#fafafa}
  header{background:#333;color:#fff;padding:1rem;text-align:center}
  header a{color:#ffeb3b;text-decoration:none;margin:0 .5rem}
  main{padding:1rem}
  footer{background:#333;color:#fff;text-align:center;padding:.5rem}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;margin-top:1rem}
  th,td{border:1px solid #ddd;padding:.5rem;text-align:left}
  th{background:#eee;cursor:pointer}
  tr:nth-child(even){background:#f9f9f9}

  /* ---------- Forms ---------- */
  form{margin-top:1rem}
  label{display:block;margin:.5rem 0}
  input[type=text],input[type=date],textarea{width:100%;padding:.4rem;border:1px solid #ccc;border-radius:4px}
  button{padding:.4rem 1rem;margin-top:.5rem;background:#4caf50;color:#fff;border:none;border-radius:4px}
  button.delete{background:#f44336}
  button:disabled{background:#9e9e9e}
  .completed{color:#4caf50;font-weight:bold}

  /* ---------- Modal ---------- */
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center}
  .modal-content{background:#fff;padding:1rem;border-radius:4px;width:90%;max-width:500px}
</style>
</head>
<body>
<header>
  <h1>Gestore di Attività</h1>
  <nav>
    <a href="#" id="viewAll">Home</a>
    <a href="#" id="newTaskBtn">Nuovo</a>
    <a href="#" id="downloadBtn">Scarica HTML</a>
  </nav>
</header>

<main id="app">
  <!-- Content will be injected by JS -->
</main>

<footer>
  © 2026 Gestore – Tutti i diritti riservati
</footer>

<!-- Modal for create/edit -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle">Nuova Attività</h2>
    <form id="taskForm">
      <label>Titolo: <input type="text" name="title" required></label>
      <label>Descrizione: <textarea name="description"></textarea></label>
      <label>Scadenza: <input type="date" name="due"></label>
      <label>Completata: <input type="checkbox" name="completed"></label>
      <button type="submit" id="saveBtn">Salva</button>
      <button type="button" id="cancelBtn">Annulla</button>
    </form>
  </div>
</div>

<script>
/* ---------- Utility ---------- */
const storageKey = 'gestor_tasks';

function loadTasks() {
  const data = localStorage.getItem(storageKey);
  return data ? JSON.parse(data) : [];
}
function saveTasks(tasks) {
  localStorage.setItem(storageKey, JSON.stringify(tasks));
}
function generateId() {
  return Date.now() + Math.random().toString(36).substr(2, 5);
}

/* ---------- UI Rendering ---------- */
function renderList(tasks) {
  const main = document.getElementById('app');
  main.innerHTML = 
    <table>
      <thead>
        <tr>
          <th>Titolo</th>
          <th>Scadenza</th>
          <th>Completata</th>
          <th>Azioni</th>
        </tr>
      </thead>
      <tbody>
        ${tasks.map(t => 
          <tr data-id="${t.id}">
            <td>${t.title}</td>
            <td>${t.due || 'N/A'}</td>
            <td class="completed">${t.completed ? '✔️' : ''}</td>
            <td>
              <button class="editBtn">Modifica</button>
              <button class="deleteBtn delete">Elimina</button>
            </td>
          </tr>
        ).join('')}
      </tbody>
    </table>
  ;
  // Attach listeners
  main.querySelectorAll('.editBtn').forEach(btn => {
    btn.addEventListener('click', () => openEditModal(btn.closest('tr').dataset.id));
  });
  main.querySelectorAll('.deleteBtn').forEach(btn => {
    btn.addEventListener('click', () => deleteTask(btn.closest('tr').dataset.id));
  });
}

function renderForm(task = null) {
  const main = document.getElementById('app');
  main.innerHTML = 
    <h2>${task ? 'Modifica Attività' : 'Nuova Attività'}</h2>
    <form id="taskForm">
      <label>Titolo: <input type="text" name="title" value="${task?.title || ''}" required></label>
      <label>Descrizione: <textarea name="description">${task?.description || ''}</textarea></label>
      <label>Scadenza: <input type="date" name="due" value="${task?.due || ''}"></label>
      <label>Completata: <input type="checkbox" name="completed" ${task?.completed ? 'checked' : ''}></label>
      <button type="submit">Salva</button>
      <button type="button" id="cancelBtn">Annulla</button>
    </form>
  ;
  document.getElementById('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    if (task) updateTask(task.id, new FormData(e.target));
    else addTask(new FormData(e.target));
  });
  document.getElementById('cancelBtn').addEventListener('click', () => renderList(loadTasks()));
}

/* ---------- CRUD ---------- */
function addTask(formData) {
  const tasks = loadTasks();
  const newTask = {
    id: generateId(),
    title: formData.get('title'),
    description: formData.get('description'),
    due: formData.get('due'),
    completed: !!formData.get('completed')
  };
  tasks.push(newTask);
  saveTasks(tasks);
  renderList(tasks);
}

function updateTask(id, formData) {
  const tasks = loadTasks();
  const index = tasks.findIndex(t => t.id == id);
  if (index !== -1) {
    tasks[index] = {
      id,
      title: formData.get('title'),
      description: formData.get('description'),
      due: formData.get('due'),
      completed: !!formData.get('completed')
    };
    saveTasks(tasks);
    renderList(tasks);
  }
}

function deleteTask(id) {
  if (!confirm('Eliminare questa attività?')) return;
  const tasks = loadTasks().filter(t => t.id != id);
  saveTasks(tasks);
  renderList(tasks);
}

/* ---------- Modal Handling ---------- */
function openEditModal(id) {
  const tasks = loadTasks();
  const task = tasks.find(t => t.id == id);
  if (!task) return;
  renderForm(task);
}

function openNewModal() {
  renderForm();
}

/* ---------- Download HTML ---------- */
function downloadHTML() {
  // Grab the current page's HTML
  const htmlContent = document.documentElement.outerHTML;
  const blob = new Blob([htmlContent], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gestor.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Event Listeners ---------- */
document.getElementById('newTaskBtn').addEventListener('click', e => {
  e.preventDefault();
  openNewModal();
});
document.getElementById('downloadBtn').addEventListener('click', e => {
  e.preventDefault();
  downloadHTML();
});

/* ---------- Init ---------- */
renderList(loadTasks());
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Animus Protocol: 3D Forest</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #030812; font-family: sans-serif; color: #fff; touch-action: none;
        }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; padding: 15px;
        }
        .top-bar {
            display: flex; justify-content: space-between; background: rgba(3, 8, 18, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.4); padding: 10px; border-radius: 6px; font-size: 13px; pointer-events: auto;
        }
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: #00f3ff; border-radius: 50%; z-index: 2;
        }
        .controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 170px; z-index: 3;
            display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; pointer-events: auto;
        }
        .dpad { width: 120px; height: 120px; position: relative; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.2); border-radius: 50%; }
        .dpad-btn { position: absolute; background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #00f3ff; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; }
        #btn-up { top: 5px; left: 40px; width: 40px; height: 35px; }
        #btn-down { bottom: 5px; left: 40px; width: 40px; height: 35px; }
        #btn-left { top: 40px; left: 5px; width: 35px; height: 40px; }
        #btn-right { top: 40px; right: 5px; width: 35px; height: 40px; }
        .btn-action {
            background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #00f3ff;
            padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="crosshair"></div>
    <div id="webgl-container"></div>

    <div class="hud">
        <div class="top-bar">
            <div>SALUTE: <span id="hp" style="color:#00f3ff">100</span>%</div>
            <div>RISORSE: <span id="res" style="color:#00f3ff">0</span>/4</div>
        </div>
        <div style="background: rgba(10,25,47,0.9); border-left: 3px solid #00f3ff; padding: 8px; font-size: 12px; border-radius: 0 6px 6px 0;" id="msg">
            Esplora la foresta e trova i moduli luminosi azzurri.
        </div>
        <div class="controls">
            <div class="dpad">
                <div class="dpad-btn" id="btn-up" ontouchstart="move('forward')" ontouchend="stop()" onmousedown="move('forward')" onmouseup="stop()">▲</div>
                <div class="dpad-btn" id="btn-down" ontouchstart="move('backward')" ontouchend="stop()" onmousedown="move('backward')" onmouseup="stop()">▼</div>
                <div class="dpad-btn" id="btn-left" ontouchstart="turn('left')" ontouchend="stopTurn()" onmousedown="turn('left')" onmouseup="stopTurn()">◀</div>
                <div class="dpad-btn" id="btn-right" ontouchstart="turn('right')" ontouchend="stopTurn()" onmousedown="turn('right')" onmouseup="stopTurn()">▶</div>
            </div>
            <div style="display:flex; flex-direction:column; justify-content:flex-end;">
                <button class="btn-action" onclick="collect()">Raccogli</button>
                <button class="btn-action" style="background:rgba(0,255,136,0.2); border-color:#00ff88; color:#00ff88;" onclick="escapeGame()">Fuga</button>
            </div>
        </div>
    </div>

<script>
    let scene, camera, renderer, dir = '', turnDir = '', pos = { x: 0, z: 0, a: 0 }, count = 0, items = [];

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030812);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x0a192f, 1.5));

        // Pavimento
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ color: 0x07111e }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Alberi
        for (let i = 0; i < 30; i++) {
            let x = (Math.random() - 0.5) * 60, z = (Math.random() - 0.5) * 60;
            if (Math.abs(x) < 3 && Math.abs(z) < 3) continue;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 4), new THREE.MeshBasicMaterial({ color: 0x112233 }));
            trunk.position.set(x, 2, z);
            scene.add(trunk);
        }

        // Oggetti da raccogliere
        for (let i = 0; i < 4; i++) {
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x00f3ff }));
            box.position.set((Math.random() - 0.5) * 25, 0.4, (Math.random() - 0.5) * 25);
            scene.add(box);
            items.push(box);
        }

        animate();
    }

    function move(d) { dir = d; }
    function stop() { dir = ''; }
    function turn(t) { turnDir = t; }
    function stopTurn() { turnDir = ''; }

    function animate() {
        requestAnimationFrame(animate);
        if (dir === 'forward') { pos.x -= Math.sin(pos.a) * 0.1; pos.z -= Math.cos(pos.a) * 0.1; }
        if (dir === 'backward') { pos.x += Math.sin(pos.a) * 0.1; pos.z += Math.cos(pos.a) * 0.1; }
        if (turnDir === 'left') pos.a += 0.04;
        if (turnDir === 'right') pos.a -= 0.04;

        camera.position.x = pos.x;
        camera.position.z = pos.z;
        camera.rotation.y = pos.a;
        renderer.render(scene, camera);
    }

    function collect() {
        items.forEach((item) => {
            let d = Math.hypot(item.position.x - pos.x, item.position.z - pos.z);
            if (d < 3 && !item.userData.taken) {
                item.userData.taken = true;
                scene.remove(item);
                count++;
                document.getElementById('res').innerText = count;
                document.getElementById('msg').innerText = `Modulo raccolto! (${count}/4)`;
            }
        });
    }

    function escapeGame() {
        if (count >= 4) {
            alert("Complimenti! Fuga completata con successo!");
            location.reload();
        } else {
            alert(`Ti servono tutti i 4 moduli! Ne hai raccolti ${count}/4.`);
        }
    }

    window.onload = init;
</script>
</body>
</html>

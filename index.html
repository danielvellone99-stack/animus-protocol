<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Animus Protocol: Stranded Shadows</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #0a192f 0%, #020c1b 100%);
            position: relative;
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(2, 12, 27, 0.95);
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.2rem;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #8892b0;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .btn {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            width: 85%;
            max-width: 280px;
        }
        .btn:active {
            background: #00f0ff;
            color: #020c1b;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: none;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64ffda;
            z-index: 5;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(10, 25, 47, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }
        canvas {
            display: none;
            background: #080f1e;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="menu-screen">
            <h1>ANIMUS PROTOCOL</h1>
            <div class="subtitle">Stranded Shadows</div>
            <button class="btn" onclick="startGame()">AVVIA SIMULAZIONE</button>
        </div>

        <div id="hud">
            <div class="hud-box" id="health-text">SALUTE: 100%</div>
            <div class="hud-box" id="score-text">DATI: 0</div>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menuScreen = document.getElementById('menu-screen');
        const hud = document.getElementById('hud');
        const healthText = document.getElementById('health-text');
        const scoreText = document.getElementById('score-text');

        let gameRunning = false;
        let score = 0;
        let health = 100;

        let player = {
            x: 50,
            y: 0,
            width: 30,
            height: 30,
            speed: 5,
            targetY: 0
        };

        let obstacles = [];
        let frameCount = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height / 2;
            player.targetY = player.y;
        }

        window.addEventListener('resize', resizeCanvas);

        // Controllo touch/mouse per muovere il personaggio su e giù fluidamente
        window.addEventListener('touchmove', (e) => {
            if (!gameRunning) return;
            player.targetY = e.touches[0].clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!gameRunning) return;
            player.targetY = e.clientY;
        });

        function startGame() {
            menuScreen.style.display = 'none';
            canvas.style.display = 'block';
            hud.style.display = 'flex';
            resizeCanvas();
            score = 0;
            health = 100;
            obstacles = [];
            gameRunning = true;
            loop();
        }

        function spawnObstacle() {
            obstacles.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - 60) + 30,
                width: 25,
                height: 25,
                speed: 4 + Math.random() * 3
            });
        }

        function update() {
            // Movimento fluido verso il tocco
            player.y += (player.targetY - player.y) * 0.1;

            // Limiti schermo
            if (player.y < 40) player.y = 40;
            if (player.y > canvas.height - 40) player.y = canvas.height - 40;

            frameCount++;
            if (frameCount % 70 === 0) {
                spawnObstacle();
            }

            // Aggiorna ostacoli
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed;

                // Controllo collisione semplice
                let dx = player.x - obs.x;
                let dy = player.y - obs.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 25) {
                    health -= 20;
                    obstacles.splice(i, 1);
                    if (health <= 0) {
                        gameRunning = false;
                        alert('Simulazione terminata! Punteggio recuperato: ' + score);
                        menuScreen.style.display = 'flex';
                        canvas.style.display = 'none';
                        hud.style.display = 'none';
                    }
                } else if (obs.x < -30) {
                    obstacles.splice(i, 1);
                    score += 10;
                }
            }

            healthText.innerText = 'SALUTE: ' + health + '%';
            scoreText.innerText = 'DATI: ' + score;
        }

        function draw() {
            ctx.fillStyle = '#050b14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Disegna griglia di sfondo digitale
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // Disegna Giocatore (Agente Animus)
            ctx.fillStyle = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f0ff';
            ctx.fillRect(player.x - 15, player.y - 15, player.width, player.height);

            // Disegna ostacoli (Glitch / Ombre corrotte)
            ctx.fillStyle = '#ff3366';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff3366';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            ctx.shadowBlur = 0; // Reset ombre
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RunGPT - Umano</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0e0e10;color:#e8e8e8;height:100vh;display:flex;flex-direction:column}
header{height:56px;background:#161617;border-bottom:1px solid #232325;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
#logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
#logo .dot{width:10px;height:10px;background:#ff2a2a;border-radius:50%;box-shadow:0 0 12px #ff2a2a}
#logo span{color:#ff2a2a}
#apiBtn{background:#1e1e20;border:1px solid #2a2a2e;color:#aaa;padding:7px 12px;border-radius:10px;font-size:12px;cursor:pointer}
#apiBtn.on{border-color:#ff2a2a;color:#ff2a2a}
#chat{flex:1;overflow:auto;padding:16px 12px;max-width:760px;width:100%;margin:0 auto}
.msg{display:flex;gap:10px;margin:14px 0}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.av.me{background:#ff2a2a;color:#fff;font-weight:700}
.av.ai{background:#1e1e20;border:1px solid #2a2a2e}
.bubble{max-width:78%;padding:12px 14px;border-radius:18px;line-height:1.55;font-size:14.5px;white-space:pre-wrap}
.me .bubble{background:#ff2a2a;color:#fff;border-bottom-right-radius:6px}
.ai .bubble{background:#1a1a1d;border:1px solid #232326;border-bottom-left-radius:6px}
.bubble img{max-width:100%;border-radius:12px;margin-top:8px}
#inputArea{padding:12px;background:#161617;border-top:1px solid #232325}
#wrap{max-width:760px;margin:0 auto;display:flex;gap:10px;background:#1e1e20;border:1px solid #2a2a2e;border-radius:24px;padding:8px 12px}
#inp{flex:1;background:transparent;border:0;color:#fff;outline:0;font-size:15px;resize:none}
#send{width:38px;height:38px;border-radius:50%;background:#ff2a2a;border:0;color:#fff;cursor:pointer;font-weight:900}
</style>
</head>
<body>
<header><div id="logo"><div class="dot"></div> Run<span>GPT</span></div><button id="apiBtn" onclick="openApi()">🔑 API</button></header>
<div id="chat"></div>
<div id="inputArea"><div id="wrap"><textarea id="inp" placeholder="Scrivi a RunGPT..."></textarea><button id="send">↑</button></div></div>
<script>
// CODICE COMPLETO NEL FILE SCARICABILE - INCOLLA TUTTO IL FILE SU GITHUB
</script>
</body>
</html>

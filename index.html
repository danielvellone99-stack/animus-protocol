<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark GPT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body { background: #212121; color: #ececec; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    * { scrollbar-width: thin; scrollbar-color: #3a3a3a #212121; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #212121; }
    ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
    .prose pre { background: #1a1a1a; border: 1px solid #2f2f2f; border-radius: .5rem; padding: 1rem; overflow-x: auto; }
    .prose code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
    .prose :not(pre) > code { background: #2f2f2f; padding: .15rem .35rem; border-radius: .3rem; }
    .prose p { margin: .5rem 0; }
    .prose ul, .prose ol { margin: .5rem 0; padding-left: 1.5rem; }
    .prose h1, .prose h2, .prose h3 { margin: 1rem 0 .5rem; font-weight: 600; }
    .prose table { border-collapse: collapse; width: 100%; }
    .prose th, .prose td { border: 1px solid #3a3a3a; padding: .4rem .6rem; }
    .sidebar { transition: transform .2s ease; }
    .typing-cursor { display: inline-block; width: 8px; height: 16px; background: #ececec; margin-left: 2px; animation: blink 1s steps(2) infinite; vertical-align: middle; }
    @keyframes blink { 50% { opacity: 0; } }
    .msg-user { background: #212121; }
    .msg-assistant { background: rgba(47,47,47,.4); }
  </style>
</head>
<body>
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <div id="overlay" class="fixed inset-0 z-30 bg-black/50 hidden md:hidden" onclick="closeSidebar()"></div>
    <aside id="sidebar" class="sidebar fixed z-40 flex h-full w-64 flex-col border-r border-[#2f2f2f] bg-[#171717] -translate-x-full md:static md:translate-x-0">
      <div class="p-3">
        <button onclick="newChat()" class="flex w-full items-center gap-2 rounded-lg border border-[#3a3a3a] px-3 py-2.5 text-sm font-medium text-white hover:bg-[#2a2a2a]">
          <span class="text-lg leading-none">+</span> Nuova chat
        </button>
      </div>
      <div class="flex-1 overflow-y-auto px-2 pb-3">
        <p class="px-2 py-2 text-xs font-semibold uppercase tracking-wide text-[#8e8e8e]">Cronologia</p>
        <div id="convList" class="space-y-1"></div>
      </div>
      <div class="border-t border-[#2f2f2f] p-3 text-xs text-[#8e8e8e]">Dark GPT · Programmazione</div>
    </aside>

    <!-- Main -->
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex items-center gap-2 border-b border-[#2f2f2f] px-3 py-3 md:hidden">
        <button onclick="openSidebar()" class="rounded-lg p-2 text-[#ececec] hover:bg-[#2a2a2a]" aria-label="Menu">☰</button>
        <span class="font-semibold">Dark GPT</span>
      </header>

      <div id="scrollArea" class="flex-1 overflow-y-auto">
        <div id="welcome" class="mx-auto flex h-full max-w-3xl flex-col items-center justify-center px-4 text-center">
          <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-600 to-fuchsia-600 text-2xl font-bold text-white">D</div>
          <h1 class="text-3xl font-semibold">Dark GPT</h1>
          <p class="mt-2 max-w-md text-[#b4b4b4]">Il tuo assistente di intelligenza artificiale specializzato in programmazione. Chiedi qualsiasi cosa: codice, debugging, architettura, algoritmi.</p>
          <div class="mt-8 grid w-full gap-3 sm:grid-cols-2">
            <button class="suggestion rounded-xl border border-[#3a3a3a] bg-[#2a2a2a] px-4 py-3 text-left text-sm text-[#ececec] hover:bg-[#333]" data-text="Scrivi una funzione in TypeScript per validare un'email">Scrivi una funzione in TypeScript per validare un'email</button>
            <button class="suggestion rounded-xl border border-[#3a3a3a] bg-[#2a2a2a] px-4 py-3 text-left text-sm text-[#ececec] hover:bg-[#333]" data-text="Spiegami le differenze tra SQL e NoSQL">Spiegami le differenze tra SQL e NoSQL</button>
            <button class="suggestion rounded-xl border border-[#3a3a3a] bg-[#2a2a2a] px-4 py-3 text-left text-sm text-[#ececec] hover:bg-[#333]" data-text="Come ottimizzare una query PostgreSQL lenta?">Come ottimizzare una query PostgreSQL lenta?</button>
            <button class="suggestion rounded-xl border border-[#3a3a3a] bg-[#2a2a2a] px-4 py-3 text-left text-sm text-[#ececec] hover:bg-[#333]" data-text="Esempio di API REST con Next.js App Router">Esempio di API REST con Next.js App Router</button>
          </div>
        </div>
        <div id="messages" class="hidden"></div>
      </div>

      <div class="border-t border-[#2f2f2f] bg-[#212121] p-4">
        <div class="mx-auto w-full max-w-3xl">
          <div class="flex items-end gap-2 rounded-2xl border border-[#3a3a3a] bg-[#2a2a2a] px-3 py-2 shadow-lg">
            <textarea id="input" rows="1" placeholder="Scrivi un messaggio a Dark GPT..." class="max-h-[200px] flex-1 resize-none bg-transparent px-2 py-2 text-[15px] text-[#ececec] outline-none placeholder:text-[#8e8e8e]"></textarea>
            <button id="sendBtn" onclick="send()" class="mb-1 flex h-9 w-9 items-center justify-center rounded-lg bg-white text-black transition disabled:cursor-not-allowed disabled:opacity-40 hover:bg-[#e5e5e5]" aria-label="Invia">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5"><path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-10.62.75.75 0 0 0 0-1.19A60.517 60.517 0 0 0 3.478 2.405Z"/></svg>
            </button>
          </div>
          <p class="mt-2 text-center text-xs text-[#8e8e8e]">Dark GPT può commettere errori. Verifica le informazioni importanti.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = ""; // stesso origin; cambia se il backend è su altro host
    let conversations = [];
    let currentId = null;
    let messages = [];
    let loading = false;

    const scrollArea = document.getElementById("scrollArea");
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const convList = document.getElementById("convList");

    function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    function renderMarkdown(text) {
      try {
        const html = marked.parse(text || "");
        return DOMPurify.sanitize(html);
      } catch (e) { return escapeHtml(text || ""); }
    }

    function renderMessages() {
      if (messages.length === 0) {
        welcomeEl.classList.remove("hidden");
        messagesEl.classList.add("hidden");
        messagesEl.innerHTML = "";
        return;
      }
      welcomeEl.classList.add("hidden");
      messagesEl.classList.remove("hidden");
      messagesEl.innerHTML = messages.map((m, i) => {
        const isUser = m.role === "user";
        const isStreaming = loading && i === messages.length - 1 && m.role === "assistant";
        const body = isUser
          ? `<p class="whitespace-pre-wrap">${escapeHtml(m.content)}</p>`
          : `${renderMarkdown(m.content)}${isStreaming ? '<span class="typing-cursor"></span>' : ""}`;
        return `
          <div class="w-full border-b border-[#2f2f2f] ${isUser ? "msg-user" : "msg-assistant"}">
            <div class="mx-auto flex max-w-3xl gap-4 px-4 py-6">
              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-sm text-sm font-bold ${isUser ? "bg-[#5a5a5a] text-white" : "bg-gradient-to-br from-violet-600 to-fuchsia-600 text-white"}">${isUser ? "U" : "D"}</div>
              <div class="prose min-w-0 flex-1 text-[15px] leading-7 text-[#ececec]">${body}</div>
            </div>
          </div>`;
      }).join("");
      scrollArea.scrollTop = scrollArea.scrollHeight;
    }

    async function loadConversations() {
      try {
        const res = await fetch(API_BASE + "/api/conversations", { cache: "no-store" });
        if (res.ok) {
          conversations = await res.json();
          renderConversations();
        }
      } catch {}
    }

    function renderConversations() {
      if (!conversations.length) {
        convList.innerHTML = '<p class="px-2 text-sm text-[#8e8e8e]">Nessuna chat salvata.</p>';
        return;
      }
      convList.innerHTML = conversations.map(c => `
        <div class="group mb-1 flex items-center gap-2 rounded-lg px-2 py-2 text-sm ${currentId === c.id ? "bg-[#2a2a2a] text-white" : "text-[#ececec] hover:bg-[#2a2a2a]"}">
          <button onclick="selectConv(${c.id})" class="flex-1 truncate text-left" title="${escapeHtml(c.title)}">${escapeHtml(c.title)}</button>
          <button onclick="event.stopPropagation(); deleteConv(${c.id})" class="hidden text-[#8e8e8e] hover:text-red-400 group-hover:block" aria-label="Elimina chat">✕</button>
        </div>
      `).join("");
    }

    async function selectConv(id) {
      try {
        const res = await fetch(API_BASE + "/api/conversations/" + id, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          messages = (data.messages || []).map(m => ({ role: m.role, content: m.content }));
          currentId = id;
          renderMessages();
          renderConversations();
          closeSidebar();
        }
      } catch {}
    }

    function newChat() {
      currentId = null;
      messages = [];
      inputEl.value = "";
      renderMessages();
      renderConversations();
      closeSidebar();
    }

    async function deleteConv(id) {
      try {
        await fetch(API_BASE + "/api/conversations/" + id, { method: "DELETE" });
        await loadConversations();
        if (currentId === id) newChat();
      } catch {}
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || loading) return;
      inputEl.value = "";
      inputEl.style.height = "auto";
      messages.push({ role: "user", content: text });
      messages.push({ role: "assistant", content: "" });
      loading = true;
      renderMessages();
      updateSendState();
      try {
        const res = await fetch(API_BASE + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversationId: currentId, message: text }),
        });
        if (!res.ok) {
          const err = await res.text();
          const last = messages[messages.length - 1];
          if (last && last.role === "assistant") last.content = "Errore: " + (err || res.statusText);
          loading = false;
          renderMessages();
          updateSendState();
          return;
        }
        const newConvId = res.headers.get("X-Conversation-Id");
        if (newConvId && currentId == null) currentId = Number(newConvId);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let acc = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          acc += decoder.decode(value, { stream: true });
          const last = messages[messages.length - 1];
          if (last && last.role === "assistant") last.content = acc;
          renderMessages();
        }
        await loadConversations();
      } catch (e) {
        const last = messages[messages.length - 1];
        if (last && last.role === "assistant") last.content = "Errore di rete: " + (e && e.message ? e.message : "");
        renderMessages();
      } finally {
        loading = false;
        renderMessages();
        updateSendState();
      }
    }

    function updateSendState() {
      sendBtn.disabled = loading || !inputEl.value.trim();
    }

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
      updateSendState();
    });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (!loading && inputEl.value.trim()) send();
      }
    });

    document.querySelectorAll(".suggestion").forEach(btn => {
      btn.addEventListener("click", () => {
        inputEl.value = btn.getAttribute("data-text");
        inputEl.dispatchEvent(new Event("input"));
        inputEl.focus();
      });
    });

    function openSidebar() {
      document.getElementById("sidebar").classList.remove("-translate-x-full");
      document.getElementById("overlay").classList.remove("hidden");
    }
    function closeSidebar() {
      document.getElementById("sidebar").classList.add("-translate-x-full");
      document.getElementById("overlay").classList.add("hidden");
    }

    loadConversations();
    renderMessages();
    updateSendState();
  </script>
</body>
</html>

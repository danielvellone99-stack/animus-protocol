<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Animus Protocol: Stranded Shadows 3D</title>
    <!-- Libreria 3D Three.js e libreria Multiplayer PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #030812; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; touch-action: none;
        }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            box-sizing: border-box; padding: 15px;
        }
        .top-bar {
            display: flex; justify-content: space-between; background: rgba(3, 8, 18, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.4); padding: 10px 15px; border-radius: 6px; font-size: 13px; pointer-events: auto;
        }
        .crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; background: #00f3ff; border-radius: 50%; box-shadow: 0 0 8px #00f3ff; z-index: 2;
        }
        .controls {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 180px; z-index: 3;
            display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; pointer-events: auto;
        }
        .dpad { width: 130px; height: 130px; position: relative; background: rgba(0,243,255,0.05); border: 1px solid rgba(0,243,255,0.2); border-radius: 50%; }
        .dpad-btn { position: absolute; background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #00f3ff; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; font-size: 14px; }
        #btn-up { top: 5px; left: 45px; width: 40px; height: 35px; }
        #btn-down { bottom: 5px; left: 45px; width: 40px; height: 35px; }
        #btn-left { top: 45px; left: 5px; width: 35px; height: 40px; }
        #btn-right { top: 45px; right: 5px; width: 35px; height: 40px; }
        .btn-action {
            background: rgba(0,243,255,0.2); border: 1px solid #00f3ff; color: #00f3ff;
            padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 13px;
        }
        .btn-action:active { background: #00f3ff; color: #030812; }
    </style>
</head>
<body>

    <div class="crosshair"></div>
    <div id="webgl-container"></div>

    <div class="hud">
        <div class="top-bar">
            <div>ANIMUS: <span style="color:#ff3366">ONLINE</span></div>
            <div>RISORSE: <span id="res" style="color:#00f3ff">0</span>/4</div>
        </div>
        <div style="background: rgba(10,25,47,0.9); border-left: 3px solid #00f3ff; padding: 10px; font-size: 12px; border-radius: 0 6px 6px 0; max-width: 260px;" id="msg">
            Trascina lo schermo per guardarti intorno. Esplora la foresta e raccogli i moduli azzurri.
        </div>
        <div class="controls">
            <div class="dpad">
                <div class="dpad-btn" id="btn-up" ontouchstart="move('forward')" ontouchend="stop()" onmousedown="move('forward')" onmouseup="stop()">▲</div>
                <div class="dpad-btn" id="btn-down" ontouchstart="move('backward')" ontouchend="stop()" onmousedown="move('backward')" onmouseup="stop()">▼</div>
                <div class="dpad-btn" id="btn-left" ontouchstart="turn('left')" ontouchend="stopTurn()" onmousedown="turn('left')" onmouseup="stopTurn()">◀</div>
                <div class="dpad-btn" id="btn-right" ontouchstart="turn('right')" ontouchend="stopTurn()" onmousedown="turn('right')" onmouseup="stopTurn()">▶</div>
            </div>
            <div style="display:flex; flex-direction:column; justify-content:flex-end;">
                <button class="btn-action" onclick="collect()">Raccogli Modulo</button>
                <button class="btn-action" style="background:rgba(0,255,136,0.2); border-color:#00ff88; color:#00ff88;" onclick="escapeGame()">Protocollo Fuga</button>
            </div>
        </div>
    </div>

<script>
    let scene, camera, renderer, dir = '', turnDir = '', pos = { x: 0, z: 0, a: 0 }, count = 0, items = [];
    let isDragging = false, prevMousePos = { x: 0, y: 0 };

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x02050b);
        scene.fog = new THREE.FogExp2(0x02050b, 0.035);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        // Luci immersive
        scene.add(new THREE.AmbientLight(0x08111d, 1.5));
        const flashlight = new THREE.PointLight(0x00f3ff, 1.2, 12);
        flashlight.position.set(0, 0, 0);
        camera.add(flashlight);
        scene.add(camera);

        // Terreno dettagliato
        const floorGeo = new THREE.PlaneGeometry(150, 150, 30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x050e1a, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Foresta 3D
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x0d1b2a });
        const leavesMat = new THREE.MeshStandardMaterial({ color: 0x091c2e, roughness: 0.8 });
        for (let i = 0; i < 45; i++) {
            let x = (Math.random() - 0.5) * 80, z = (Math.random() - 0.5) * 80;
            if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 6, 6), trunkMat);
            trunk.position.set(x, 3, z);
            scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 6, 6), leavesMat);
            leaves.position.set(x, 7, z);
            scene.add(leaves);
        }

        // Moduli da raccogliere (oggetti tecnologici luminosi)
        const boxGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x00aaff, emissiveIntensity: 0.6 });
        for (let i = 0; i < 4; i++) {
            const box = new THREE.Mesh(boxGeo, boxMat);
            box.position.set((Math.random() - 0.5) * 35, 0.4, (Math.random() - 0.5) * 35);
            scene.add(box);
            items.push(box);
        }

        setupTouchLook();
        animate();
    }

    // Gestione controllo visuale a trascinamento (Touch e Mouse)
    function setupTouchLook() {
        window.addEventListener('pointerdown', (e) => {
            if (e.clientY < window.innerHeight - 200) { // Evita i pulsanti HUD in basso
                isDragging = true;
                prevMousePos = { x: e.clientX, y: e.clientY };
            }
        });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - prevMousePos.x;
            pos.a -= deltaX * 0.005; // Sensibilità di rotazione
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointerup', () => { isDragging = false; });
    }

    function move(d) { dir = d; }
    function stop() { dir = ''; }
    function turn(t) { turnDir = t; }
    function stopTurn() { turnDir = ''; }

    function animate() {
        requestAnimationFrame(animate);

        // Movimento in avanti/indietro orientato verso la direzione dello sguardo
        if (dir === 'forward') {
            pos.x -= Math.sin(pos.a) * 0.12;
            pos.z -= Math.cos(pos.a) * 0.12;
        }
        if (dir === 'backward') {
            pos.x += Math.sin(pos.a) * 0.12;
            pos.z += Math.cos(pos.a) * 0.12;
        }
        if (turnDir === 'left') pos.a += 0.05;
        if (turnDir === 'right') pos.a -= 0.05;

        camera.position.x = pos.x;
        camera.position.z = pos.z;
        camera.rotation.y = pos.a;

        renderer.render(scene, camera);
    }

    function collect() {
        let collected = false;
        items.forEach((item) => {
            let d = Math.hypot(item.position.x - pos.x, item.position.z - pos.z);
            if (d < 3.5 && !item.userData.taken) {
                item.userData.taken = true;
                scene.remove(item);
                count++;
                document.getElementById('res').innerText = count;
                document.getElementById('msg').innerText = `Modulo sincronizzato! (${count}/4)`;
                collected = true;
            }
        });
        if (!collected) {
            document.getElementById('msg').innerText = "Nessun modulo nel raggio d'azione. Avvicinati ai cubi luminosi!";
        }
    }

    function escapeGame() {
        if (count >= 4) {
            alert("🏆 STRAORDINARIO! Simulazione violata e fuga completata!");
            location.reload();
        } else {
            alert(`❌ Moduli insufficienti (${count}/4)! Ti servono tutti per attivare il portale.`);
        }
    }

    window.onload = init;
    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark GPT Astra 1 - Image Generator</title>
    <style>
        :root {
            --bg-sidebar: #0f0505;
            --bg-main: #070202;
            --bg-input: #1a0808;
            --text-main: #ececec;
            --text-secondary: #9b9b9b;
            --accent: #ff2222;
            --border: #331010;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #050000 0%, #1f0202 50%, #050000 100%);
            color: var(--text-main);
            overflow: hidden;
        }

        sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            background-color: rgba(255, 34, 34, 0.1);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover:not(:disabled) {
            background-color: rgba(255, 34, 34, 0.25);
            border-color: var(--accent);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-box {
            background: #000000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            color: #ff6666;
            text-align: center;
            font-weight: bold;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover {
            background-color: rgba(255, 34, 34, 0.1);
            color: var(--text-main);
        }

        .history-item.active {
            background-color: rgba(255, 34, 34, 0.2);
            color: var(--text-main);
            border-left: 3px solid var(--accent);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            background-color: var(--bg-main);
        }

        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 16px;
            font-weight: 600;
            background-color: var(--bg-sidebar);
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ff6666;
            letter-spacing: 0.5px;
        }

        .chat-header img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            object-fit: cover;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .welcome-screen {
            text-align: center;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .welcome-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 25px rgba(255, 34, 34, 0.4);
            object-fit: cover;
        }

        .welcome-screen h1 {
            color: var(--text-main);
            font-size: 28px;
            text-shadow: 0 0 10px rgba(255, 34, 34, 0.3);
        }

        .result-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        .result-box img {
            width: 100%;
            border-radius: 12px;
            border: 2px solid var(--border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .prompt-title {
            font-size: 15px;
            color: var(--text-main);
            text-align: center;
            font-weight: 500;
        }

        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 30px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .loading-spinner {
            border: 4px solid rgba(255, 34, 34, 0.2);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-container {
            padding: 20px;
            background: var(--bg-main);
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 800px;
            width: 100%;
            background-color: var(--bg-input);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 10px 15px;
            border: 1px solid var(--border);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            max-height: 150px;
            outline: none;
            padding: 5px 0;
            line-height: 1.4;
        }

        .send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 10px;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.9;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <sidebar>
        <div class="sidebar-header">
            <button class="btn" id="newGenBtn" onclick="startNewImageSession()">
                <span style="color: var(--accent); font-weight: bold;">+</span> Nuova generazione
            </button>
            <div class="status-box" id="statusBox">
                ⚡ Astra 1 Engine: Pronto
            </div>
        </div>
        <div class="history-list" id="historyList"></div>
    </sidebar>

    <div class="main-container">
        <div class="chat-header">
            <img id="headerLogo" src="" alt="Logo">
            <span>DARK GPT ASTRA 1 - IMAGE GENERATOR</span>
        </div>
        
        <div class="content-area" id="contentArea">
            <div class="welcome-screen" id="welcomeScreen">
                <img id="mainLogo" src="" alt="Dark GPT Logo" class="welcome-logo">
                <h1>DARK GPT ASTRA 1</h1>
                <p>Generatore di immagini neurale integrato. Scrivi una descrizione per iniziare.</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="Descrivi l'immagine da creare..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="generateImage()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Logo integrato direttamente nel codice (funziona ovunque senza file esterni)
        const LOGO_URL = "https://image.pollinations.ai/prompt/A%20futuristic%20skull%20logo%20with%20letters%20DG%20and%20text%20DARK%20GPT,%20neon%20red%20and%20black,%20cyberpunk,%20high%20quality?width=400&height=400&seed=1714395696&nologo=true";

        let generations = JSON.parse(localStorage.getItem('astra1_images_optimized')) || [];
        let currentId = null;
        let isCooldown = false;
        let cooldownTimer = null;

        function applyLogos() {
            const headerLogo = document.getElementById('headerLogo');
            const mainLogo = document.getElementById('mainLogo');
            if (headerLogo) headerLogo.src = LOGO_URL;
            if (mainLogo) mainLogo.src = LOGO_URL;
        }

        function init() {
            applyLogos();
            renderHistory();
            if (generations.length > 0) {
                selectGeneration(generations[0].id);
            }
        }

        function saveGenerations() {
            localStorage.setItem('astra1_images_optimized', JSON.stringify(generations));
        }

        function startNewImageSession() {
            if (isCooldown) return;
            currentId = null;
            renderHistory();
            document.getElementById('contentArea').innerHTML = `
                <div class="welcome-screen" id="welcomeScreen">
                    <img id="mainLogo" src="${LOGO_URL}" alt="Dark GPT Logo" class="welcome-logo">
                    <h1>DARK GPT ASTRA 1</h1>
                    <p>Generatore di immagini neurale integrato. Scrivi una descrizione per iniziare.</p>
                </div>
            `;
        }

        function selectGeneration(id) {
            currentId = id;
            renderHistory();
            const gen = generations.find(g => g.id === id);
            if (gen) {
                const area = document.getElementById('contentArea');
                area.innerHTML = `
                    <div class="result-box">
                        <div class="prompt-title">"${gen.prompt}"</div>
                        <img src="${gen.image}" alt="${gen.prompt}">
                    </div>
                `;
            }
        }

        function renderHistory() {
            const listEl = document.getElementById('historyList');
            listEl.innerHTML = '';
            generations.forEach(item => {
                const div = document.createElement('div');
                div.className = `history-item ${item.id === currentId ? 'active' : ''}`;
                div.textContent = item.prompt;
                div.onclick = () => { if(!isCooldown) selectGeneration(item.id); };
                listEl.appendChild(div);
            });
        }

        function startCooldown() {
            isCooldown = true;
            const sendBtn = document.getElementById('sendBtn');
            const statusBox = document.getElementById('statusBox');
            sendBtn.disabled = true;

            let timeLeft = 45;
            statusBox.style.color = "#ffaa00";
            statusBox.textContent = `⏳ Cooldown server: ${timeLeft}s`;

            cooldownTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    statusBox.textContent = `⏳ Cooldown server: ${timeLeft}s`;
                } else {
                    clearInterval(cooldownTimer);
                    isCooldown = false;
                    sendBtn.disabled = false;
                    statusBox.style.color = "#ff6666";
                    statusBox.textContent = `⚡ Astra 1 Engine: Pronto`;
                }
            }, 1000);
        }

        function generateImage() {
            if (isCooldown) return;

            const input = document.getElementById('userInput');
            const promptText = input.value.trim();
            if (!promptText) return;

            input.value = '';
            input.style.height = 'auto';

            const area = document.getElementById('contentArea');
            area.innerHTML = `
                <div class="loading-box">
                    <div class="loading-spinner"></div>
                    <div class="prompt-title" style="color: #ff6666;">Astra 1 sta sintetizzando l'immagine...</div>
                    <div style="font-size: 12px; color: var(--text-secondary);">Elaborazione in corso, attendi...</div>
                </div>
            `;

            const encodedPrompt = encodeURIComponent(promptText);
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=768&height=768&seed=${seed}&nologo=true`;

            const img = new Image();
            img.src = imageUrl;

            img.onload = () => {
                const newGen = {
                    id: Date.now().toString(),
                    prompt: promptText,
                    image: imageUrl
                };

                generations.unshift(newGen);
                saveGenerations();
                selectGeneration(newGen.id);
                
                startCooldown();
            };

            img.onerror = () => {
                area.innerHTML = `
                    <div class="welcome-screen">
                        <h1 style="color: #ff4444;">Errore di Connessione</h1>
                        <p>Impossibile contattare il server di generazione. Riprova tra poco.</p>
                    </div>
                `;
                isCooldown = false;
                document.getElementById('sendBtn').disabled = false;
            };
        }

        function handleKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                generateImage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        init();
    </script>
</body>
</html>

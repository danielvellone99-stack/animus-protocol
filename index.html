<style>
#dragonPwaBar{position:fixed;bottom:0;left:0;right:0;z-index:999999;background:#0f0f0f;border-top:2px solid #FF1A1A;padding:12px;box-shadow:0 -5px 20px rgba(0,0,0,.8)}
#dragonPwaBar .hint{background:rgba(255,26,26,.12);border:1px solid rgba(255,26,26,.25);border-radius:8px;padding:8px 10px;font-size:11px;color:#ffb3b3;text-align:center;margin-bottom:10px}
#dragonPwaBar .row{display:flex;gap:10px}
.btn-pwa{flex:1;padding:14px 10px;border-radius:12px;border:0;font-weight:900;font-size:13px;cursor:pointer}
.btn-fs{background:#222;color:#fff;border:1px solid #444}
.btn-install{background:linear-gradient(90deg,#FF1A1A,#cc0000);color:#fff}
#topBanner{position:fixed;top:0;left:0;right:0;z-index:999998;background:#1a0a2e;border-bottom:1px solid #FF1A1A;color:#fff;padding:10px 12px;font-size:11px;text-align:center;display:flex;justify-content:space-between;align-items:center}
</style>
<div id="topBanner"><span>Per rimuovere la barra Google: <b>Aggiungi a Home → Apri dall'icona</b>. Oppure fullscreen sotto.</span><button onclick="this.parentElement.style.display='none';document.body.style.paddingTop='0'" style="background:#333;border:0;color:#fff;width:28px;height:28px;border-radius:50%">✕</button></div>
<div id="dragonPwaBar"><div class="hint">Per rimuovere la barra Google: Aggiungi a Home → Apri dall'icona. Oppure vai a schermo intero qui sotto.</div><div class="row"><button class="btn-pwa btn-fs" onclick="window.dragonFullscreen()">⛶ Nascondi barra - Vai a schermo intero</button><button class="btn-pwa btn-install" onclick="window.dragonInstall()">📲 Installa PWA</button></div></div>
<script>
(function(){
  window.dragonFullscreen=function(){
    try{
      const el=document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen();
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      window.scrollTo(0,1);
      document.querySelector('#dragonPwaBar .hint').innerHTML='✅ Schermo intero! Swipe dall\'alto per uscire.';
      document.getElementById('topBanner').style.display='none';
      document.body.style.paddingTop='0';
    }catch(e){ alert('Aggiungi a Home per schermo intero vero'); }
  };
  let deferredPrompt=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
  window.dragonInstall=function(){
    if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(c=>{ if(c.outcome==='accepted') document.querySelector('#dragonPwaBar .hint').innerHTML='✅ Installato! Apri dalla Home.'; deferredPrompt=null; }); }
    else {
      const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
      if(isIOS) alert('iPhone:\n1. Condividi (quadrato con freccia)\n2. Aggiungi a Home\n3. Apri dall\'icona - barra sparisce!');
      else alert('Android:\n1. Menu ⋮ → Aggiungi a schermata Home / Installa app\n2. Apri dall\'icona - schermo intero senza barra!');
    }
  };
  window.addEventListener('load',()=>{
    document.body.style.paddingTop='44px';
    document.body.style.paddingBottom='90px';
    if(window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone){
      document.getElementById('topBanner').style.display='none';
      document.body.style.paddingTop='0';
      document.querySelector('#dragonPwaBar .hint').innerHTML='✅ App installata! Schermo intero senza barra Google.';
      setTimeout(()=>{document.getElementById('dragonPwaBar').style.transform='translateY(100%)';document.getElementById('dragonPwaBar').style.transition='transform .5s';},3000);
    }
  });
})();
</script>

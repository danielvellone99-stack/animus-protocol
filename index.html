<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Animus Protocol: Stranded Shadows</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #0a192f 0%, #020c1b 100%);
            position: relative;
        }
        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(2, 12, 27, 0.95);
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 2.2rem;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #8892b0;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .btn {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 14px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            width: 85%;
            max-width: 280px;
        }
        .btn:active {
            background: #00f0ff;
            color: #020c1b;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }
        #canvas-area {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: none;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64ffda;
            z-index: 5;
            pointer-events: none;
        }
        .hud-box {
            background: rgba(10, 25, 47, 0.8);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="menu-screen">
            <h1>ANIMUS PROTOCOL</h1>
            <div class="subtitle">Stranded Shadows</div>
            <button class="btn" onclick="startGame()">AVVIA SIMULAZIONE</button>
            <button class="btn" onclick="alert('Modalità Online in arrivo!')">MULTIPLAYER</button>
        </div>

        <div id="hud">
            <div class="hud-box">SALUTE: 100%</div>
            <div class="hud-box">SETTORE: TROPICALE</div>
        </div>

        <div id="canvas-area">
            <p style="color: #8892b0; text-align: center; padding: 20px;">Caricamento memoria genetica in corso...<br>Isola tropicale in caricamento.</p>
        </div>
    </div>

    <script>
        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('canvas-area').style.display = 'flex';
            document.getElementById('hud').style.display = 'flex';
        }
    </script>
</body>
</html>

#g1v1-modal.open{display:flex}
.g1v1-card{width:100%;max-width:360px;background:#151D29;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:20px;color:#fff}
.g1v1-input{width:100%;height:56px;border-radius:999px;background:#0B0F19;border:1px solid rgba(255,255,255,.15);color:#fff;padding:0 20px;font-size:20px;font-weight:900;letter-spacing:.25em;text-align:center;text-transform:uppercase;outline:none}
.g1v1-btn-y{width:100%;height:54px;border-radius:999px;background:#FFD60A;color:#000;border:none;font-weight:900;font-size:14px;cursor:pointer}
.g1v1-btn-w{width:100%;height:50px;border-radius:999px;background:#fff;color:#000;border:none;font-weight:800;font-size:13px;cursor:pointer}
</style>
<button id="g1v1-btn">⚔️ 1V1 ONLINE</button>
<div id="g1v1-modal">
  <div class="g1v1-card">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px;font-weight:900">ONLINE 1V1</h2><button id="g1v1-close" style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff">✕</button></div>
    <div id="g1v1-info" style="margin-top:10px;font-size:11px;padding:10px;border-radius:12px;background:rgba(255,214,10,.12)">Codice semplice tipo 7UXA. Server stabile, non cancella più le stanze.</div>
    <div id="g1v1-lobby">
      <button id="g1v1-create" class="g1v1-btn-y" style="margin-top:16px">CREA STANZA</button>
      <div style="margin:14px 0;display:flex;align-items:center;gap:10px"><div style="height:1px;flex:1;background:rgba(255,255,255,.1)"></div><span style="font-size:10px;opacity:.4">OPPURE</span><div style="height:1px;flex:1;background:rgba(255,255,255,.1)"></div></div>
      <input id="g1v1-code-in" class="g1v1-input" placeholder="7UXA" maxlength="4">
      <button id="g1v1-join" class="g1v1-btn-w" style="margin-top:10px">ENTRA</button>
    </div>
    <div id="g1v1-room" style="display:none">
      <div style="margin-top:16px;background:#0B0F19;border-radius:18px;padding:16px;text-align:center;border:1px solid rgba(255,214,10,.25)"><div style="font-size:10px;opacity:.5;letter-spacing:.2em">CODICE</div><div id="g1v1-code" style="font-size:44px;font-weight:900;color:#FFD60A;letter-spacing:.3em;margin-top:4px">----</div><button id="g1v1-copy" style="margin-top:6px;background:none;border:none;color:#FFD60A;font-size:11px;font-weight:700;text-decoration:underline">COPIA CODICE</button></div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:12px;padding:12px"><div id="g1v1-dot" style="width:8px;height:8px;background:#F59E0B;border-radius:50%"></div><div id="g1v1-room-status" style="font-size:12px;font-weight:700">Connessione...</div></div>
      <div id="g1v1-players" style="margin-top:10px;background:rgba(0,0,0,.35);border-radius:12px;padding:12px;font-size:12px"><div style="display:flex;justify-content:space-between"><span>👤 TU</span><span id="g1v1-my">0m</span></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span id="g1v1-opp-label">👤 AVVERSARIO</span><span id="g1v1-opp">--</span></div></div>
      <button id="g1v1-start" class="g1v1-btn-y" style="margin-top:14px;display:none">START 1V1 ⚔️</button>
      <button id="g1v1-leave" style="margin-top:8px;width:100%;height:42px;border-radius:999px;background:rgba(255,255,255,.06);border:none;color:rgba(255,255,255,.6);font-weight:700">ESCI</button>
      <div id="g1v1-debug" style="margin-top:8px;font-size:9px;opacity:.4;font-family:monospace"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const modal=$('g1v1-modal'), btn=$('g1v1-btn'), close=$('g1v1-close');
  const lobby=$('g1v1-lobby'), roomDiv=$('g1v1-room'), codeEl=$('g1v1-code'), info=$('g1v1-info'), roomStatus=$('g1v1-room-status'), dot=$('g1v1-dot');
  const myEl=$('g1v1-my'), oppEl=$('g1v1-opp'), oppLabel=$('g1v1-opp-label'), players=$('g1v1-players'), startBtn=$('g1v1-start'), debug=$('g1v1-debug'), codeIn=$('g1v1-code-in');
  let roomCode=null, isHost=false, isInRace=false, myFinal=0, oppFinal=0, gun=null, roomRef=null, myId=null;

  const genCode=()=>{ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };
  btn.onclick=()=>modal.classList.add('open');
  close.onclick=()=>modal.classList.remove('open');
  modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('open'); });
  $('g1v1-copy').onclick=()=>{ navigator.clipboard.writeText(roomCode); const b=$('g1v1-copy'); b.textContent='COPIATO!'; setTimeout(()=>b.textContent='COPIA CODICE',1500); };
  $('g1v1-leave').onclick=leave;

  function leave(){
    try{ if(roomRef){ roomRef.get('host').put(null); roomRef.get('guest').put(null); } }catch{}
    roomCode=null; isHost=false; isInRace=false; lobby.style.display='block'; roomDiv.style.display='none'; startBtn.style.display='none'; debug.textContent='';
    info.textContent='Codice semplice tipo 7UXA. Server stabile, non cancella più le stanze.'; info.style.background='rgba(255,214,10,.12)';
  }

  function initGun(){
    if(gun) return gun;
    gun = Gun(['https://gun-manhattan.herokuapp.com/gun', 'https://relay.3dvr.tech/gun', 'https://gun-us.herokuapp.com/gun']);
    myId = 'p_'+Math.random().toString(36).slice(2,8);
    return gun;
  }

  function joinRoom(code, host){
    initGun();
    roomCode=code; isHost=host; codeEl.textContent=code; lobby.style.display='none'; roomDiv.style.display='block';
    info.textContent = host ? 'Stanza '+code+' creata! Manda codice' : 'Entrato in '+code;
    roomStatus.textContent='Connesso al server...'; dot.style.background='#F59E0B';
    debug.textContent='ID:'+myId+' | Codice:'+code;

    const base = gun.get('grisolia-v8-'+code);
    roomRef = base;

    if(host){
      base.get('host').put({id:myId, time:Date.now()});
      roomStatus.textContent='Stanza '+code+' aperta - aspetta amico'; dot.style.background='#10B981';
      info.textContent='✅ Stanza aperta! Manda '+code+' all\'amico su Telegram'; info.style.background='rgba(16,185,129,.15)';
      startBtn.style.display='none';
    } else {
      base.get('guest').put({id:myId, time:Date.now()});
      roomStatus.textContent='Sei entrato in '+code+' - attendo host...'; dot.style.background='#10B981';
    }

    // ascolta guest
    base.get('guest').on(data=>{
      if(!data || !data.id) return;
      if(data.id===myId) return;
      console.log('Guest visto', data);
      roomStatus.textContent='Amico connesso!'; oppLabel.textContent='👤 AMICO ('+code+')'; dot.style.background='#10B981';
      info.textContent='✅ Avversario connesso!'; info.style.background='rgba(16,185,129,.2)';
      if(isHost) startBtn.style.display='block';
    });

    // ascolta host (per guest)
    base.get('host').on(data=>{
      if(!data || !data.id) return;
      if(data.id===myId) return;
      console.log('Host visto', data);
      roomStatus.textContent='Host connesso! In attesa START...'; dot.style.background='#10B981';
      info.textContent='✅ Connesso a HOST '+code; info.style.background='rgba(16,185,129,.2)';
      oppLabel.textContent='👤 HOST ('+code+')';
    });

    // ascolta start
    base.get('start').on(data=>{
      if(!data || !data.t) return;
      if(data.from===myId) return;
      console.log('Start ricevuto', data);
      doCountdown();
    });

    // ascolta score
    base.get('scores').map().on((data, key)=>{
      if(!data) return;
      if(key===myId) return;
      const s = data.s;
      if(s!==undefined){ oppEl.textContent=s+'m'; oppFinal=s; }
      if(data.final){ oppFinal=data.s; oppEl.textContent=data.s+'m FINITO'; checkWin(); }
    });
  }

  $('g1v1-create').onclick=()=>{ const code=genCode(); joinRoom(code, true); };
  $('g1v1-join').onclick=()=>{
    const code=codeIn.value.trim().toUpperCase();
    if(code.length<4){ alert('Inserisci codice di 4 lettere tipo 7UXA'); return; }
    joinRoom(code, false);
  };

  startBtn.onclick=()=>{
    if(!roomRef) return;
    roomRef.get('start').put({t:Date.now(), from:myId});
    doCountdown();
  };

  function doCountdown(){
    modal.classList.remove('open');
    let c=3;
    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:100001;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:120px;font-weight:900;color:#FFD60A;font-family:system-ui';
    ov.innerHTML='<div>'+c+'</div><div style="font-size:13px;color:#fff;margin-top:10px">'+roomCode+'</div>';
    document.body.appendChild(ov);
    const iv=setInterval(()=>{
      c--; ov.firstChild.textContent=c>0?c:'VIA!'; if(c<=0){ clearInterval(iv); setTimeout(()=>{ ov.remove(); startGame(); },500); }
    },700);
  }

  function startGame(){
    isInRace=true; myFinal=0; oppFinal=0;
    const playBtn = Array.from(document.querySelectorAll('button')).find(b=> b.textContent && b.textContent.includes('CORRI A GRISOLIA'));
    if(playBtn) playBtn.click();
    let lastSent=0;
    let poll=setInterval(()=>{
      if(!isInRace){ clearInterval(poll); return; }
      let cur=0; try{ const m=document.body.innerText.match(/([0-9]+)\s*m/); if(m) cur=parseInt(m[1]); }catch{}
      myEl.textContent=cur+'m'; myFinal=cur;
      if(Date.now()-lastSent>300 && roomRef){ lastSent=Date.now(); roomRef.get('scores').get(myId).put({s:cur, t:Date.now()}); }
      if(document.body.innerHTML.includes('RUN AGAIN')){ isInRace=false; clearInterval(poll); if(roomRef) roomRef.get('scores').get(myId).put({s:myFinal, final:true, t:Date.now()}); setTimeout(checkWin,600); }
    },300);
  }

  function checkWin(){
    if(myFinal>0 && oppFinal>0){
      setTimeout(()=>{ const win=myFinal>oppFinal; alert((win?'🏆 HAI VINTO! ':'😅 HAI PERSO! ')+'Tu '+myFinal+'m vs '+oppFinal+'m'); },400);
    }
  }
})();
</script>

</body>
</html>
